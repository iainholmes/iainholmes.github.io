name: Field Brief 042 guarded preparation
on:
  push:
    branches: [recovery/field-brief-2026-11-07]
    paths:
      - daily-watchlist-5/index.html
      - .github/workflows/field-brief-042-recovery.yml
  pull_request:
    branches: [master]
    paths:
      - daily-watchlist-5/index.html
      - .github/workflows/field-brief-042-recovery.yml
permissions:
  contents: write
concurrency:
  group: field-brief-042-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'iainholmes/iainholmes.github.io'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/field-brief-2026-11-07
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Recompute historical editorial memory and verify issue order
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='daily-watchlist-5/index.html';
          const src=fs.readFileSync(p,'utf8'),m=src.match(/id="briefing-data">([\s\S]*?)<\/script>/);
          const d=JSON.parse(m[1]),e=d.editions.at(-1);
          if(d.editions.length!==42||e.date!=='2026-11-07'||e.stories.length!==5||d.editions.filter(x=>x.date===e.date).length!==1)throw Error('Unexpected due edition');
          require('./daily-watchlist-5/editorial-order.cjs').validate(e);
          const mem=require('./personal-updates/editorial-memory.js');
          const history=mem.history(d.editions,e.date);
          e.editorialSelection.historyDates=history.map(x=>x.date);
          e.editorialSelection.candidates=e.editorialSelection.candidates.map(c=>{
            const story=e.stories.find(s=>s.title===c.title);
            if(!story)return c;
            const a=mem.assess(story,d.editions,e.date);
            return {...c,rawPenalty:a.rawPenalty,matchedDimensions:[...new Set(a.matches.flatMap(m=>Object.keys(m.shared)))]};
          });
          e.editorialSelection.diversity=mem.review(e.stories);
          if(e.editorialSelection.diversity.needsEditorialDecision)throw Error('Editor must resolve domain concentration');
          fs.writeFileSync(p,src.replace(m[1],'\n'+JSON.stringify(d,null,2)+'\n'));
          console.log('Validated 7-edition memory review, 5 story ordering, local 05, 42 archived issues');
          NODE
      - name: Canonical original artwork and full preparation
        run: node scripts/prepare_periodicals.cjs
      - name: Run publication validation and originality regression checks
        run: |
          node scripts/check_field_brief.cjs 2026-11-07
          node scripts/test_field_brief_order.cjs
          node scripts/test_issue_marks.cjs
          node scripts/test_publishing.cjs
          node scripts/test_periodicals_publication_watchdog.cjs
          git diff --check
      - name: Inspect derived artifact scope
        run: |
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const d=JSON.parse(fs.readFileSync('daily-watchlist-5/index.html','utf8').match(/id="briefing-data">([\s\S]*?)<\/script>/)[1]).editions;
          if(d.length!==42||d.at(-1).date!=='2026-11-07'||d.at(-1).stories[4].editorial.feature!=='north-carolina')throw Error('Due issue invalid');
          const marks=require('./personal-updates/issue-mark-archive.js'),art=require('./daily-watchlist-5/artwork-archive.js');
          const cover=marks['fb:2026-11-07'],plates=art.issues['2026-11-07'];
          if(!cover?.frozen||cover.no!=='042'||!plates||d.at(-1).stories.some(st=>!plates[st.number]?.frozen))throw Error('Missing original cover or story plates');
          const hub=fs.readFileSync('personal-updates/index.html','utf8');
          if(!hub.includes('data-issue-mark="fb" data-edition="2026-11-07"')||!hub.includes(cover.frozen))throw Error('Outdated hub');
          const changed=cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed=new Set(['daily-watchlist-5/index.html','daily-watchlist-5/artwork-archive.js','personal-updates/index.html','personal-updates/issue-mark-archive.js']);
          if(changed.some(x=>!allowed.has(x)))throw Error('Other publication changed: '+changed);
          console.log('Checked complete 042 art, issue ordering and isolated diff:',changed);
          NODE
      - name: Commit validated new original artwork and hub
        run: |
          git config user.name "Field Brief guarded preparation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-watchlist-5/index.html daily-watchlist-5/artwork-archive.js personal-updates/index.html personal-updates/issue-mark-archive.js
          git diff --cached --check
          git commit -m "Prepare and pin original Field Brief 042 artwork" || true
          git push origin HEAD:recovery/field-brief-2026-11-07
