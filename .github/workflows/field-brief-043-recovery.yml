name: Field Brief 043 guarded preparation
on:
  push:
    branches: [recovery/field-brief-2026-11-08]
    paths:
      - 'daily-watchlist-5/index.html'
      - '.github/workflows/field-brief-043-recovery.yml'
  pull_request:
    branches: [master]
    paths:
      - 'daily-watchlist-5/index.html'
      - '.github/workflows/field-brief-043-recovery.yml'
permissions:
  contents: write
concurrency:
  group: field-brief-043-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'iainholmes/iainholmes.github.io'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: recovery/field-brief-2026-11-08, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate archive, substantive editorial choices and historic overlap
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='daily-watchlist-5/index.html';
          const src=fs.readFileSync(p,'utf8'),m=src.match(/id="briefing-data">([\s\S]*?)<\/script>/);
          const d=JSON.parse(m[1]),e=d.editions.at(-1);
          if(d.editions.length!==43||e.date!=='2026-11-08'||e.stories.length!==5||d.editions.filter(x=>x.date===e.date).length!==1)throw Error('Wrong due issue');
          require('./daily-watchlist-5/editorial-order.cjs').validate(e);
          const mem=require('./personal-updates/editorial-memory.js');
          const history=mem.history(d.editions,e.date);
          e.editorialSelection.historyDates=history.map(x=>x.date);
          e.editorialSelection.candidates=e.editorialSelection.candidates.map(c=>{
            const story=e.stories.find(s=>s.title===c.title);
            if(!story)return c;
            const a=mem.assess(story,d.editions,e.date);
            return {...c,rawPenalty:a.rawPenalty,matchedDimensions:[...new Set(a.matches.flatMap(m=>Object.keys(m.shared)))]};
          });
          const review=mem.review(e.stories);
          e.editorialSelection.diversity=review;
          if(review.needsEditorialDecision)throw Error('Domain diversity requires a genuine editorial decision: '+JSON.stringify(review));
          fs.writeFileSync(p,src.replace(m[1],'\n'+JSON.stringify(d,null,2)+'\n'));
          console.log('Historical seven-edition review, original source links, 5 stories, local story 05, 43 total issues passed');
          NODE
      - name: Generate all original art and metadata using official publisher
        run: node scripts/prepare_periodicals.cjs
      - name: Release, originality and retention regressions
        run: |
          node scripts/check_field_brief.cjs 2026-11-08
          node scripts/test_field_brief_order.cjs
          node scripts/test_issue_marks.cjs
          node scripts/test_field_brief_cover_042.cjs
          node scripts/test_publishing.cjs
          node scripts/test_periodicals_publication_watchdog.cjs
          git diff --check
      - name: Confirm original dated artwork and only allowed generated artifacts
        run: |
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const d=JSON.parse(fs.readFileSync('daily-watchlist-5/index.html','utf8').match(/id="briefing-data">([\s\S]*?)<\/script>/)[1]).editions;
          if(d.length!==43||d.at(-1).date!=='2026-11-08'||d.at(-1).stories[4].editorial.feature!=='north-carolina')throw Error('Due issue invalid');
          const cover=require('./personal-updates/issue-mark-archive.js')['fb:2026-11-08'];
          const plates=require('./daily-watchlist-5/artwork-archive.js').issues['2026-11-08'];
          if(!cover?.frozen||cover.no!=='043'||!plates||d.at(-1).stories.some(st=>!plates[st.number]?.frozen))throw Error('Original cover or story plates incomplete');
          const old=require('./personal-updates/issue-mark-archive.js')['fb:2026-11-07'];
          const art=require('./daily-watchlist-5/artwork.js');
          const similarity=art.visualSimilarity(art.issueFeatures(cover),art.issueFeatures(old));
          if(similarity>=.72)throw Error('Insufficient meaningful visual difference from Issue 042: '+similarity);
          const hub=fs.readFileSync('personal-updates/index.html','utf8');
          if(!hub.includes('data-issue-mark="fb" data-edition="2026-11-08"')||!hub.includes(cover.frozen))throw Error('Stale Periodicals hub');
          const changed=cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed=new Set(['daily-watchlist-5/index.html','daily-watchlist-5/artwork-archive.js','personal-updates/index.html','personal-updates/issue-mark-archive.js']);
          if(changed.some(x=>!allowed.has(x)))throw Error('Unrelated publisher changed: '+changed);
          console.log('New 043 original art and full live publication metadata ready; neighbor silhouette similarity:',similarity,changed);
          NODE
      - name: Pin original art and hub to isolated release branch
        run: |
          git config user.name "Field Brief guarded release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-watchlist-5/index.html daily-watchlist-5/artwork-archive.js personal-updates/index.html personal-updates/issue-mark-archive.js
          git diff --cached --check
          git commit -m "Prepare and pin original Field Brief 043 artwork" || true
          git push origin HEAD:recovery/field-brief-2026-11-08
