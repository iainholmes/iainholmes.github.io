name: TEMP IH Workbook rendered-state validation
on:
  push:
    branches: [validation/ih-house-divider-20261117]
    paths: [.github/workflows/ih-house-divider-validation.yml]
permissions:
  contents: read
concurrency:
  group: ih-ecosystem-validation-${{ github.sha }}
  cancel-in-progress: true
jobs:
  webkit:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.57.0-noble
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        state: [baseline, proposed]
        include:
          - state: baseline
            source: 'de025feb2e5f9ac769e7f1fbc7dea0d0bc82353d'
          - state: proposed
            source: '16b878bbe5712efe9ec6e0c5da59222241826f73'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use pinned WebKit runtime
        run: npm install --prefix "$RUNNER_TEMP/ih-browser" --no-save --ignore-scripts --package-lock=false playwright@1.57.0
      - name: Existing Workbook suite with failure-only state capture
        if: always()
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ runner.temp }}/ih-browser/node_modules
          WB_ORIGIN: http://127.0.0.1:8765
          WB_QA_DIR: ${{ runner.temp }}/ih-webkit-evidence/workbook
        run: |
          node <<'WB_DIAGNOSTIC'
          const fs=require('node:fs');
          let source=fs.readFileSync('scripts/test_workbook_browser.cjs','utf8');
          // Selecting an option replaces the entire question DOM. Await that new render
          // before the next real pointer click; retain every original assertion and action.
          const selectNeedle="await p.locator('[data-opt=\\\"0\\\"]').click();equal(await p.locator('details[data-learning=\\\"explanation\\\"]').count(),0,'draft selection does not reveal an answer');";
          if(!source.includes(selectNeedle))throw Error('Post-selection render boundary missing');
          source=source.replace(selectNeedle,selectNeedle+"await ready(p);await p.locator('[data-act=\\\"answer\\\"]').evaluate(async e=>{let prior='',stable=0;for(let n=0;n<120&&stable<5;n++){await new Promise(requestAnimationFrame);const r=e.getBoundingClientRect(),now=[r.x,r.y,scrollY,r.width,r.height].join(',');stable=now===prior?stable+1:0;prior=now;}if(stable<5)throw Error('Unstable submit target');});");
          const needle="await p.waitForSelector('details[data-learning=\"explanation\"]');const explanation=";
          const replacement="try{await p.waitForSelector('details[data-learning=\"explanation\"]');}catch(err){await shot(p,'failure-at-'+e.no+'-'+q.id);fs.writeFileSync(path.join(out,'failure-context.json'),JSON.stringify({set:e.no,date:e.date,question:q.id,state:await state(p,e.date),hash:await p.url(),dom:await p.locator('#answerLearning').innerHTML(),selected:await p.locator('[data-opt]').evaluateAll(es=>es.map(el=>({index:el.dataset.opt,className:el.className}))),buttons:await p.locator('[data-act=\"answer\"]').evaluateAll(es=>es.map(el=>({disabled:el.disabled,text:el.textContent})))},null,2));throw err;}const explanation=";
          if(!source.includes(needle))throw Error('Diagnostic insertion missing');
          source=source.replace(needle,replacement);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/ih-workbook-diagnostic.cjs',source);
          WB_DIAGNOSTIC
          node "$RUNNER_TEMP/ih-workbook-diagnostic.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ih-house-webkit-${{ matrix.state }}
          path: ${{ runner.temp }}/ih-webkit-evidence
          retention-days: 3
