name: TEMP IH QST portrait refinement validation
on:
  push:
    branches: [validation/ih-house-divider-20261117]
    paths: [.github/workflows/ih-house-divider-validation.yml]
permissions:
  contents: read
concurrency:
  group: ih-ecosystem-validation-${{ github.sha }}
  cancel-in-progress: true
jobs:
  chromium:
    strategy:
      fail-fast: false
      matrix:
        viewport: [macbook-air, tablet, iphone, landscape]
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.57.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '16b878bbe5712efe9ec6e0c5da59222241826f73'
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: iainholmes/econometric-advisor
          ref: '21c335ea180f8ccc40fa44c3698758067e220fcd'
          path: econometric-advisor
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: iainholmes/quant-skills-trainer
          ref: '017e708c00659d0836090b4d5a4f07184a1f6958'
          path: quant-skills-trainer
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trust the exact three checked-out source paths
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/econometric-advisor"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/quant-skills-trainer"
          npm install --prefix "$RUNNER_TEMP/ih-browser" --no-save --ignore-scripts --package-lock=false playwright@1.57.0
      - name: Serve isolated before and after source
        run: |
          mkdir -p "$RUNNER_TEMP/ih-house-evidence"
          git worktree add --detach "$RUNNER_TEMP/ih-before" de025feb2e5f9ac769e7f1fbc7dea0d0bc82353d
          git -C econometric-advisor worktree add --detach "$RUNNER_TEMP/ih-before/econometric-advisor" dddcdb09566f7b5ae6b2f1b969ceed99b122413c
          git -C quant-skills-trainer worktree add --detach "$RUNNER_TEMP/ih-before/quant-skills-trainer" 3a81a4d4322769ce30950dd3bf7255eec462895b
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/ih-house-evidence/preview-after.log" 2>&1 &
          python3 -m http.server 8766 --bind 127.0.0.1 --directory "$RUNNER_TEMP/ih-before" > "$RUNNER_TEMP/ih-house-evidence/preview-before.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8765/
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8766/
      - name: Compare source, controls, geometry and actual rendered dividers
        env:
          IH_VIEWPORT: ${{ matrix.viewport }}
          IH_PLAYWRIGHT: ${{ runner.temp }}/ih-browser/node_modules/playwright
          IH_EVIDENCE: ${{ runner.temp }}/ih-house-evidence
        run: |
          node <<'JS'
          const fs=require('node:fs'),cp=require('node:child_process'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const {chromium}=require(process.env.IH_PLAYWRIGHT);
          const repos=[{dir:'.',base:'de025feb2e5f9ac769e7f1fbc7dea0d0bc82353d',head:'16b878bbe5712efe9ec6e0c5da59222241826f73',files:["index.html","personal-updates/index.html","daily-watchlist-5/index.html","daily-econ-challenge/index.html","rupert/assets/css/atlas.css","rupert/index.html","desk/HOUSE-DIVIDER-SYSTEM.md","scripts/test_periodicals.cjs"]},{dir:'econometric-advisor',base:'dddcdb09566f7b5ae6b2f1b969ceed99b122413c',head:'21c335ea180f8ccc40fa44c3698758067e220fcd',files:['index.html','HOUSE-DIVIDER-SYSTEM.md']},{dir:'quant-skills-trainer',base:'3a81a4d4322769ce30950dd3bf7255eec462895b',head:'017e708c00659d0836090b4d5a4f07184a1f6958',files:['index.html','HOUSE-DIVIDER-SYSTEM.md']}];
          for(const r of repos){
           assert.equal(cp.execFileSync('git',['-C',r.dir,'rev-parse','HEAD'],{encoding:'utf8'}).trim(),r.head);
           const paths=cp.execFileSync('git',['-C',r.dir,'diff','--name-only',r.base,r.head],{encoding:'utf8'}).trim().split('\n').sort();assert.deepEqual(paths,r.files.slice().sort());
           for(const path of paths.filter(p=>p.endsWith('.html'))){const before=cp.execFileSync('git',['-C',r.dir,'show',r.base+':'+path],{encoding:'utf8',maxBuffer:8*1024*1024}),after=fs.readFileSync(r.dir+'/'+path,'utf8');assert.equal(after.replace(/<style id="ih-house-dividers">[\s\S]*?<\/style>\n/,'').replace('atlas.css?v=b92390ae33da-ih-house-1','atlas.css?v=b92390ae33da'),before,'Strict HTML/scripts/data/artwork preservation '+r.dir+'/'+path);}
           if(r.dir==='.'){const before=cp.execFileSync('git',['show',r.base+':rupert/assets/css/atlas.css'],{encoding:'utf8'}),after=fs.readFileSync('rupert/assets/css/atlas.css','utf8');assert.equal(after.slice(0,after.indexOf('\n/* IH_HOUSE_DIVIDER_V1:')),before,'Atlas original stylesheet intact');}
          }
          const cases=[
           {id:'home',path:'/',target:'#research > .section-title',modes:['default']},
           {id:'hub',path:'/personal-updates/',target:'.press-note',modes:['default'],spine:true},
           {id:'field-brief',path:'/daily-watchlist-5/',target:'.front',modes:['day','night']},
           {id:'workbook',path:'/daily-econ-challenge/',target:'.ps-title',modes:['day','night']},
           {id:'atlas',path:'/rupert/',target:'.weekband',modes:['default']},
           {id:'advisor',path:'/econometric-advisor/',target:'.ov-toolkit-band',modes:['default']},
           {id:'qst',path:'/quant-skills-trainer/?lang=r&module=r_env',target:'.sess-header',modes:['light','dark'],langLabel:'R'},
           {id:'qst-python',path:'/quant-skills-trainer/?lang=python&module=py_env',target:'.sess-header',modes:['light','dark'],langLabel:'Python'},
           {id:'qst-stata',path:'/quant-skills-trainer/?lang=stata&module=st_env',target:'.sess-header',modes:['light','dark'],langLabel:'Stata'}
          ];
          // The baseline Advisor throws this missing helper during library initialization; record every occurrence, reject any new error type.
          const evidence=[],functional=[],browserErrors=[];
          async function prepare(page,item,origin){
           await page.goto(origin+item.path,{waitUntil:'networkidle'});await page.evaluate(()=>document.fonts.ready);
           if(item.id==='advisor'){
            await page.getByRole('button',{name:'Begin assessment',exact:true}).click();await page.locator('#api-modal .btn-skip').click();
            for(let n=0;n<35;n++){
             if(await page.locator('.ov-toolkit-band').isVisible())break;
             const old=await page.locator('#quiz-inner .q-label').textContent(),go=page.locator('#quiz-inner .btn-cont');
             if(await go.isVisible())await go.click();else await page.locator('#quiz-inner .chip').first().click();
             await page.waitForFunction(old=>document.getElementById('screen-results').style.display==='block'||document.querySelector('#quiz-inner .q-label')?.textContent!==old,old);
            }
            await page.locator('.ov-toolkit-band').waitFor({state:'visible'});
            if(await page.locator('.tour-skip').isVisible())await page.locator('.tour-skip').click();
           }
           await page.locator(item.target).first().waitFor({state:'visible'});
           // Results generate new font faces and navigation rows; settle the same content before comparison.
           await page.evaluate(async()=>{await document.fonts.ready;window.scrollTo({top:0,behavior:'instant'});await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));});
           if(item.id==='advisor')await page.waitForFunction(()=>document.getElementById('tk-jump-nav').classList.contains('show'));
           // Require stable document geometry over actual render frames, preserving the strict comparison.
           await page.locator(item.target).first().evaluate(async e=>{let prior='',stable=0;for(let n=0;n<120&&stable<5;n++){await new Promise(requestAnimationFrame);const r=e.getBoundingClientRect(),now=[r.x,r.y+scrollY,r.width,r.height].join(',');stable=now===prior?stable+1:0;prior=now;}if(stable<5)throw Error('Unstable comparison layout');});
          }
          async function setMode(page,item,mode){
           if(mode==='day'||mode==='night'){await page.locator('button[data-mode="'+mode+'"]').first().click();await page.waitForFunction(m=>document.documentElement.dataset.mode===m,mode);}
           if(mode==='light'||mode==='dark'){if(await page.evaluate(()=>document.documentElement.dataset.theme==='dark'?'dark':'light')!==mode)await page.locator('#theme-toggle').click();await page.waitForFunction(m=>(document.documentElement.dataset.theme==='dark'?'dark':'light')===m,mode);}
          }
          (async()=>{
           const browser=await chromium.launch({headless:true});
           try{
            for(const size of [{name:'macbook-air',width:1710,height:1107},{name:'tablet',width:1024,height:900},{name:'iphone',width:390,height:844},{name:'landscape',width:844,height:390}].filter(v=>!process.env.IH_VIEWPORT||v.name===process.env.IH_VIEWPORT)){
             for(const item of cases.filter(c=>c.id.startsWith('qst'))){
              console.log('Render',item.id,size.name);
              const context=await browser.newContext({viewport:{width:size.width,height:size.height},reducedMotion:'reduce',hasTouch:size.width<900});
              await context.addInitScript(()=>localStorage.setItem('advisor_tour_v1','done'));
              const before=await context.newPage(),after=await context.newPage();
              for(const [page,label]of [[before,'before'],[after,'after']])page.on('pageerror',e=>browserErrors.push({property:item.id,size:size.name,state:label,message:e.message}));
              await prepare(before,item,'http://127.0.0.1:8766');await prepare(after,item,'http://127.0.0.1:8765');
              for(const mode of item.modes){
               await setMode(before,item,mode);await setMode(after,item,mode);
               const metrics=[];
               for(const page of [before,after])metrics.push(await page.locator(item.target).first().evaluate(e=>{const r=e.getBoundingClientRect();return{x:r.x,y:r.y+scrollY,width:r.width,height:r.height,viewport:innerWidth,scroll:document.documentElement.scrollWidth,controls:document.querySelectorAll('button,input,textarea,select,a').length};}));
               for(const k of ['x','y','width','height'])assert(Math.abs(metrics[0][k]-metrics[1][k])<.5,item.id+' '+size.name+' preserved '+k+' '+JSON.stringify(metrics));
               assert.equal(metrics[0].controls,metrics[1].controls,item.id+' controls unchanged');assert(metrics[1].scroll<=Math.max(metrics[0].scroll,size.width)+1,item.id+' no new horizontal overflow');
               const pseudo=await after.locator(item.target).first().evaluate((e,spine)=>{const p=getComputedStyle(e,spine?'::before':'::after');return{pointer:p.pointerEvents,clip:p.clipPath,height:p.height,width:p.width,display:p.display,border:getComputedStyle(e).borderBottomColor};},!!item.spine);assert.equal(pseudo.pointer,'none');assert(pseudo.clip.startsWith('polygon('));if(item.id.startsWith('qst')&&size.width<=600){assert.equal(pseudo.display,'none');const borderBefore=await before.locator(item.target).first().evaluate(e=>getComputedStyle(e).borderBottomColor);assert.equal(pseudo.border,borderBefore,'Portrait retains its original border');}else assert.notEqual(pseudo.display,'none');
               for(const [label,page]of [['before',before],['after',after]]){
                await page.locator(item.target).first().evaluate((e,spine)=>{const r=e.getBoundingClientRect();window.scrollTo({top:scrollY+(spine?r.top:r.bottom)-innerHeight*(spine?.25:.55),behavior:'instant'});},!!item.spine);
                const file=item.id+'-'+size.name+'-'+mode+'-'+label+'.png',path=process.env.IH_EVIDENCE+'/'+file;
                await page.screenshot({path,animations:'disabled'});const bytes=fs.readFileSync(path);
                evidence.push({property:item.id,viewport:size,mode,state:label,file,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),metrics:metrics[label==='before'?0:1],pseudo});
               }
              }
              if(item.id.startsWith('qst')){
               for(const page of [before,after]){await page.locator('#pbtn-practice').click();assert(await page.locator('#code-input').isVisible());await page.locator('#pbtn-learn').click();assert(await page.locator('#learn-out').isVisible());assert.equal(await page.locator('#sess-pill').textContent(),item.langLabel);}
               functional.push({property:item.id,viewport:size.name,learningPractice:true});
              }
              if(item.id==='advisor'){
               for(const page of [before,after]){await page.locator('.tk-jump-chip[data-tab="methods"]').click();assert(await page.locator('#tk-spec').isVisible());await page.locator('.tk-jump-chip[data-tab="graph"]').click();assert(await page.locator('#tk-graph').isVisible());}
               functional.push({property:item.id,viewport:size.name,offlineAssessment:true,methodsAndGraphTabs:true});
              }
              await context.close();
             }
            }
            for(const item of cases){const old=new Set(browserErrors.filter(e=>e.property===item.id&&e.state==='before').map(e=>e.message));if(item.id==='advisor')old.add('_updateComparativeAvailability is not defined');for(const e of browserErrors.filter(e=>e.property===item.id&&e.state==='after'))assert(old.has(e.message),item.id+' new script error: '+e.message);}
           }finally{await browser.close();fs.writeFileSync(process.env.IH_EVIDENCE+'/manifest.json',JSON.stringify({sources:repos,evidence,functional,browserErrors},null,2));}
           console.log(JSON.stringify({result:'passed',screenshots:evidence.length,functional,sourcePreservation:true}));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ih-house-qst-${{ matrix.viewport }}
          path: ${{ runner.temp }}/ih-house-evidence
          retention-days: 3
