name: TEMP — Complete source-reviewed L&L Edition 007
on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/recover_ll_007.cjs'
      - '.github/workflows/ll-007-build-temp.yml'
permissions:
  contents: write
jobs:
  publish-candidate:
    if: github.repository == 'iainholmes/iainholmes.github.io' && github.head_ref == 'recovery/ll-edition-007-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/ll-edition-007-20261106
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fast-forward with latest master and preserve competing publication changes
        run: |
          git config user.name "LL Edition 007 recovery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git merge --no-edit origin/master
      - name: Author canonical new issue from individually sourced research
        run: node scripts/recover_ll_007.cjs
      - name: Generate unique new art and reading index only after independent source gates
        run: node scripts/prepare_periodicals.cjs
      - name: Source-to-component, original composition, Notebook, Field Register and artwork regressions
        run: |
          node weekly-economics-environment/source-evidence.cjs
          node weekly-economics-environment/notebook/validate.cjs
          node weekly-economics-environment/field-register-schema.cjs
          node scripts/test_ll_source_evidence.cjs
          node scripts/test_ll_publication_layout.cjs
          node scripts/test_editorial_folio.cjs
          node scripts/test_editorial_rail.cjs
          node scripts/test_notebook.cjs
          node scripts/test_field_register.cjs
          node scripts/test_issue_marks.cjs
          node scripts/test_publishing.cjs
          git diff --check
      - name: Confirm one exact dated issue, five complete articles, and no history loss
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('weekly-economics-environment/index.html','utf8');
          const dates=[...s.matchAll(/<section class="edition"[^>]*data-edition="([^"]+)"/g)].map(x=>x[1]);
          if(dates.length!==7||dates.at(-1)!=='2026-11-06'||dates.filter(x=>x==='2026-11-06').length!==1)throw Error('Edition archive/date integrity');
          const ed=s.match(/<section class="edition"[^>]*data-edition="2026-11-06"[\s\S]*?(?=<\/main>)/)[0];
          if((ed.match(/<article class="entry"/g)||[]).length!==5)throw Error('Five readings absent');
          const e=JSON.parse(fs.readFileSync('weekly-economics-environment/source-evidence.json','utf8'));
          for(const id of ['farm-robots','fire-exposure','groundwater-choice','pollution-salience','seagrass-carbon']){
            const k='2026-11-06-'+id;
            if(!e.readings[k]||e.readings[k].components.some(c=>c.status!=='verified'))throw Error('Incomplete verified component '+k);
          }
          const cover=require('./personal-updates/issue-mark-archive.js')['sp:2026-11-06'];
          if(!cover?.frozen||cover.date!=='2026-11-06')throw Error('No dated original cover');
          const study=JSON.parse(s.match(/id="field-studies">([\s\S]*?)<\/script>/)[1])['2026-11-06'];
          if(!study?.html||study.version!==4)throw Error('No original field-study');
          const hub=fs.readFileSync('personal-updates/index.html','utf8');
          if(!hub.includes('data-issue-mark="sp" data-edition="2026-11-06"')||!hub.includes(cover.frozen))throw Error('Hub out of sync');
          console.log('LL_007_CANDIDATE_INTEGRITY_OK',dates.length, 'editions', e.readings['2026-11-06-farm-robots'].components.length,'robot evidence components');
          NODE
      - name: Ensure diff stays inside authorized L&L issue and shared fresh issue-mark metadata
        run: |
          node - <<'NODE'
          const cp=require('child_process');
          const paths=cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed=new Set([
            'weekly-economics-environment/index.html',
            'weekly-economics-environment/editorial-decisions.json',
            'weekly-economics-environment/reading-arrangements.cjs',
            'weekly-economics-environment/source-evidence.json',
            'weekly-economics-environment/notebook/index.html',
            'weekly-economics-environment/notebook/reviews.json',
            'weekly-economics-environment/field-register-history.json',
            'weekly-economics-environment/reading-feature-inventory.json',
            'weekly-economics-environment/reading-field-guide/index.html',
            'personal-updates/issue-mark-archive.js',
            'personal-updates/index.html'
          ]);
          const bad=paths.filter(x=>!allowed.has(x));
          if(bad.length)throw Error('Unauthorized generated file changes '+JSON.stringify(bad));
          console.log('ISOLATED_AUTHORIZED_DIFF',paths.length,paths.join(', '));
          NODE
      - name: Commit validated issue to protected recovery branch only
        run: |
          git add weekly-economics-environment/index.html weekly-economics-environment/editorial-decisions.json weekly-economics-environment/reading-arrangements.cjs weekly-economics-environment/source-evidence.json weekly-economics-environment/notebook/index.html weekly-economics-environment/notebook/reviews.json weekly-economics-environment/field-register-history.json weekly-economics-environment/reading-feature-inventory.json weekly-economics-environment/reading-field-guide/index.html personal-updates/issue-mark-archive.js personal-updates/index.html
          git diff --cached --check
          git commit -m "Prepare fully sourced Loblolly & Logit Edition 007 for review"
          git push origin HEAD:recovery/ll-edition-007-20261106
