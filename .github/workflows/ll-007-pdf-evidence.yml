name: TEMP L&L 007 verifiable primary-source artifact hashes
on:
  pull_request:
    branches: [master]
    paths: ['.github/workflows/ll-007-pdf-evidence.yml']
permissions: {contents: read}
jobs:
  papers:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch primary paper artifacts and print verifiable fingerprints
        run: |
          python -m pip install -q pypdf
          mkdir -p "$RUNNER_TEMP/research"
          python - <<'PY'
          from urllib.request import Request, urlopen
          import hashlib,os
          from pypdf import PdfReader
          from io import BytesIO
          sources={
             'steel':'https://www.nature.com/articles/s41467-026-78786-1.pdf',
             'robots':'https://www.nature.com/articles/s41467-026-78281-7.pdf',
             'fire':'https://www.nature.com/articles/s41467-026-78904-z.pdf',
             'groundwater':'https://www.dallasfed.org/~/media/documents/research/papers/2026/wp2626.pdf',
             'pollution':'https://www.nber.org/system/files/working_papers/w35969/w35969.pdf'
          }
          for name,url in sources.items():
            try:
              req=Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urlopen(req,timeout=50) as f:
                b=f.read()
              print('ARTIFACT',name,'bytes',len(b),'sha256',hashlib.sha256(b).hexdigest(),'magic',repr(b[:20]),flush=True)
              if b[:4]==b'%PDF':
                reader=PdfReader(BytesIO(b))
                print('PAPER',name,'pages',len(reader.pages),'p2',repr((reader.pages[1].extract_text() or '')[:340]),flush=True)
            except Exception as e:print('ERROR',name,str(e),flush=True)
          PY
