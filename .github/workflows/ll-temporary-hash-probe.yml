name: TEMP Scholarly paper artifact hash probe
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  probe:
    if: github.event.issue.number == 80 && contains(github.event.comment.body, '/verify-ll-source-hashes-007')
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact public PDF source versions and record SHA-256, pages and availability
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python -m pip install -q pypdf
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import os,hashlib,json,urllib.request,subprocess
          from pypdf import PdfReader
          from io import BytesIO
          papers={
            'steel':'https://www.nature.com/articles/s41467-026-78786-1.pdf',
            'robots':'https://www.nature.com/articles/s41467-026-78281-7.pdf',
            'fire':'https://www.nature.com/articles/s41467-026-78904-z.pdf',
            'groundwater':'https://www.dallasfed.org/~/media/documents/research/papers/2026/wp2626.pdf',
            'pollution':'https://www.nber.org/system/files/working_papers/w35969/w35969.pdf',
            'seagrass':'https://www.nature.com/articles/s41467-026-79168-3.pdf'
          }
          rows=[]
          for key,url in papers.items():
            row={'paper':key,'url':url}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=35) as r:b=r.read()
              row['bytes']=len(b);row['sha256']=hashlib.sha256(b).hexdigest();row['pdf']=b[:4]==b'%PDF'
              if row['pdf']:
                reader=PdfReader(BytesIO(b));row['pages']=len(reader.pages);row['excerpts']=[{'pdfPage':i+1,'text':(reader.pages[i].extract_text() or '')[:1250].replace('\n',' ')} for i in {'robots':[0,2,4,6,8,10], 'fire':[0,2,4,6,8,10,12], 'groundwater':[1,3,11,20,26,35,42], 'pollution':[1,4,12,22,36,50,69], 'seagrass':[0,2,4,6,8]}.get(key,[]) if i<len(reader.pages)]
            except Exception as e:row['error']=str(e)[:160]
            rows.append(row)
          body='Primary-source artifact fetch results (not substantive review):\n\n'+ '\n'.join('- '+str(x) for x in rows)
          print(body)
          payload=json.dumps({'body':body}).encode()
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPOSITORY']+'/issues/'+os.environ['ISSUE_NUMBER']+'/comments',payload,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'LoblollySourceProbe','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=20) as r:print('COMMENT_POSTED',r.status)
          PY
          python "$RUNNER_TEMP/probe.py"
