name: Periodicals — independent publication watchdog
on:
  pull_request:
    branches: [master]
    paths:
      - scripts/periodicals-publication-watchdog.cjs
      - scripts/test_periodicals_publication_watchdog.cjs
      - .github/workflows/periodicals-publication-watchdog.yml
  schedule:
    - cron: '17,47 8-18 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: periodicals-publication-watchdog
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate grace periods, DST, archive and incident logic
        run: node scripts/test_periodicals_publication_watchdog.cjs
      - name: Independently verify due canonical editions, live Pages and covers
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/periodicals-publication-watchdog.cjs
