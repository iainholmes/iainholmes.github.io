name: Temporary AI publisher capability check
on:
  push:
    branches: [fix/periodicals-publication-watchdog-20261106]
    paths: ['.github/workflows/publisher-capability-check-temp.yml']
  pull_request:
    branches: [master]
    paths: ['.github/workflows/publisher-capability-check-temp.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'iainholmes/iainholmes.github.io'
    runs-on: ubuntu-24.04
    steps:
      - name: Check configured external authoring credentials without reading or printing them
        env:
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_AZURE_OPENAI: ${{ secrets.AZURE_OPENAI_API_KEY != '' }}
          HAS_FOUNDRY: ${{ secrets.FOUNDRY_API_KEY != '' }}
          HAS_COPILOT: ${{ secrets.COPILOT_PAT != '' }}
        run: |
          echo "OPENAI_API_KEY configured = $HAS_OPENAI"
          echo "AZURE_OPENAI_API_KEY configured = $HAS_AZURE_OPENAI"
          echo "FOUNDRY_API_KEY configured = $HAS_FOUNDRY"
          echo "COPILOT_PAT configured = $HAS_COPILOT"
