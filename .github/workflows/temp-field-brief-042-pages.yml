name: TEMP Field Brief 042 live release parity
on:
  push:
    branches: [verify/field-brief-042-pages]
    paths: [.github/workflows/temp-field-brief-042-pages.yml]
  pull_request:
    branches: [master]
    paths: [.github/workflows/temp-field-brief-042-pages.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: master}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Compare live issue, source data, cover and five plates
        run: |
          node scripts/check_field_brief.cjs 2026-11-07
          for i in 1 2 3 4 5 6; do
            curl -fLsS --max-time 20 -H 'Cache-Control: no-cache' "https://iainholmes.github.io/daily-watchlist-5/?verify=20261107-$i" -o "$RUNNER_TEMP/brief.html"
            curl -fLsS --max-time 20 -H 'Cache-Control: no-cache' "https://iainholmes.github.io/personal-updates/?verify=20261107-$i" -o "$RUNNER_TEMP/hub.html"
            if node - <<'NODE'
          const fs=require('fs'),p=process.env.RUNNER_TEMP;
          const extract=s=>JSON.parse(s.match(/id="briefing-data">([\s\S]*?)<\/script>/)[1]).editions;
          const local=extract(fs.readFileSync('daily-watchlist-5/index.html','utf8'));
          const live=extract(fs.readFileSync(p+'/brief.html','utf8'));
          const pin=require('./personal-updates/issue-mark-archive.js')['fb:2026-11-07'];
          const html=fs.readFileSync(p+'/hub.html','utf8');
          if(local.length!==42||live.length!==local.length||JSON.stringify(live.at(-1))!==JSON.stringify(local.at(-1)))process.exit(1);
          if(!pin?.frozen||!html.includes('data-issue-mark="fb" data-edition="2026-11-07"')||!html.includes(pin.frozen))process.exit(1);
          console.log('PUBLIC_FIELD_BRIEF_042_PARITY_OK: 42 issues, latest November 7, content and frozen cover exact');
          NODE
            then exit 0
            fi
            sleep 12
          done
          echo 'Public Field Brief 042 parity not reached'; exit 1
