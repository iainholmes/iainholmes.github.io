name: TEMP Retrieve L&L source artifacts and hashes
on:
  push:
    branches: [master]
    paths: [.github/workflows/temp-ll-primary-source-probe.yml]
permissions: {contents: read}
jobs:
  download:
    runs-on: ubuntu-24.04
    steps:
      - name: Download five source PDFs, compute immutable versions and inspect text availability
        run: |
          python -m pip install -q pypdf
          mkdir -p "$RUNNER_TEMP/ll"
          fetch() {
            name="$1";url="$2";out="$RUNNER_TEMP/ll/$name"
            code=$(curl -L -sS --retry 2 --max-time 60 -A 'Mozilla/5.0' -o "$out" -w '%{http_code}' "$url" || true)
            echo "ARTIFACT name=$name code=$code bytes=$(wc -c < "$out") sha256=$(sha256sum "$out" | cut -d' ' -f1) kind=$(file -bi "$out")"
            python - "$out" <<'PY'
          import sys
          from pypdf import PdfReader
          try:
              r=PdfReader(sys.argv[1])
              print('PAPER_PAGES', len(r.pages))
              print('PAPER_INTRO', (r.pages[1].extract_text() or '')[:600].replace('\n',' '))
          except Exception as e: print('PAPER_FAILED',repr(e))
          PY
          }
          fetch steel https://www.nature.com/articles/s41467-026-78786-1.pdf
          fetch robots https://www.nature.com/articles/s41467-026-78281-7.pdf
          fetch fire https://www.nature.com/articles/s41467-026-78904-z.pdf
          fetch groundwater https://www.dallasfed.org/~/media/documents/research/papers/2026/wp2626.pdf
          fetch pollution https://www.nber.org/system/files/working_papers/w35969/w35969.pdf
          echo PRIMARY_SOURCE_CHECK_COMPLETE
