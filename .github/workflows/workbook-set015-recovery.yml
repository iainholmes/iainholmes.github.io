# Temporary, strictly branch-scoped recovery runner. Delete before merging to master.
name: Workbook Set 015 guarded preparation
on:
  pull_request:
    branches: [master]
    paths:
      - 'daily-econ-challenge/index.html'
      - '.github/workflows/workbook-set015-recovery.yml'
      - 'scripts/fixtures/art-originality.cjs'
      - 'scripts/test_issue_marks.cjs'
  push:
    branches: [recovery/workbook-2026-11-06]
    paths:
      - 'daily-econ-challenge/index.html'
      - '.github/workflows/workbook-set015-recovery.yml'
      - 'scripts/fixtures/art-originality.cjs'
      - 'scripts/test_issue_marks.cjs'
permissions:
  contents: write
jobs:
  prepare-validate-and-stage:
    if: github.repository == 'iainholmes/iainholmes.github.io' && (github.ref == 'refs/heads/recovery/workbook-2026-11-06' || github.head_ref == 'recovery/workbook-2026-11-06')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/workbook-2026-11-06
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact issue and validate assistance before writing
        run: |
          node daily-econ-challenge/learning-schema.cjs
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('daily-econ-challenge/index.html','utf8');
          const ed=JSON.parse(s.match(/id="challenge-data">([\s\S]*?)<\/script>/)[1]).editions;
          if(ed.length!==15||ed.at(-1).no!==15||ed.at(-1).date!=='2026-11-06'||ed.at(-1).questions.length!==8)throw Error('Unexpected Workbook release state');
          if(ed.filter(x=>x.date==='2026-11-06').length!==1)throw Error('Duplicate issue date');
          console.log('Set 015 preflight and complete historical archive verified');
          NODE
      - name: Generate frozen original illustration and refresh Periodicals metadata
        run: node scripts/prepare_periodicals.cjs
      - name: Execute canonical release and preservation regressions
        run: |
          node scripts/test_workbook_learning.cjs
          node scripts/test_workbook_marks.cjs
          node scripts/test_issue_marks.cjs
          node scripts/test_periodicals.cjs
          node scripts/test_publishing.cjs
          git diff --check
      - name: Confirm no unauthorized generated changes
        run: |
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const text=fs.readFileSync('daily-econ-challenge/index.html','utf8');
          const ed=JSON.parse(text.match(/id="challenge-data">([\s\S]*?)<\/script>/)[1]).editions;
          if(ed.length!==15||ed.at(-1).date!=='2026-11-06')throw Error('Issue changed during preparation');
          const archive=require('./personal-updates/issue-mark-archive.js');
          const m=archive['cp:2026-11-06'];
          if(!m||m.version!==4||m.no!=='015'||!m.frozen||!m.signature)throw Error('Missing correct original frozen mark');
          const hub=fs.readFileSync('personal-updates/index.html','utf8');
          if(!/data-issue-mark="cp" data-edition="2026-11-06"/.test(hub))throw Error('Hub not on Set 015');
          const changed=cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed=new Set(['personal-updates/issue-mark-archive.js','personal-updates/index.html']);
          if(changed.some(x=>!allowed.has(x)))throw Error('Non-Workbook generated changes: '+changed.join(', '));
          if(changed.length!==2)throw Error('Expected original art and hub metadata, got '+changed);
          console.log('Frozen mark, hub, and isolated generated diff validated:',changed.join(', '));
          NODE
      - name: Commit validated derived artifacts to recovery branch
        run: |
          git config user.name "Workbook recovery validation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personal-updates/issue-mark-archive.js personal-updates/index.html
          git diff --cached --check
          git commit -m "Prepare original Set 015 mark and Periodicals metadata"
          git push origin HEAD:recovery/workbook-2026-11-06
