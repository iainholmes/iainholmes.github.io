<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=STIX+Two+Text:ital,wght@0,400;0,500;1,400&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --paper:#f7f7f3;
  --sheet:#fdfdfb;
  --grid:rgba(28,47,74,.055);
  --grid-major:rgba(28,47,74,.085);
  --ink:#1d2126;
  --text:#2b3036;
  --muted:#5f666e;
  --rule:#d3d8dc;
  --rule-strong:#1d2126;
  --teal:#0e5360;
  --teal-wash:#e3eef0;
  --navy:#1c2f4a;
  --right:#17624a;
  --right-wash:#e4f0ea;
  --wrong:#9a3b2e;
  --wrong-wash:#f6e6e2;
  --ui:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --math:"STIX Two Text","STIX Two Math","Cambria",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{background:var(--paper);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--text);font:15px/1.6 var(--ui);-webkit-font-smoothing:antialiased;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid-major) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  background-position:-1px -1px;
}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--paper);padding:8px 12px;z-index:50}.skip:focus{left:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ---------- running header ---------- */
.runhead{border-bottom:1px solid var(--rule-strong);background:color-mix(in srgb,var(--paper) 92%,transparent);position:sticky;top:0;z-index:20;backdrop-filter:blur(6px)}
.runhead-inner{max-width:1180px;margin:0 auto;padding:0 28px;height:56px;display:flex;align-items:center;gap:24px}
.wordmark{position:absolute;left:50%;transform:translateX(-50%);font:italic 400 19px/1 var(--math);text-decoration:none;color:var(--ink);opacity:0;transition:opacity .2s}
body.scrolled .wordmark,body.ledger .wordmark{opacity:1}
.wordmark i{color:var(--teal)}
.runhead-inner{position:relative}
.runhead nav.site{margin-left:auto;display:flex;gap:4px;align-items:center}
.runhead nav.site a{font:500 12px/1 var(--mono);text-decoration:none;color:var(--muted);background:none;border:1px solid transparent;padding:9px 10px;letter-spacing:.02em}
.runhead nav.site a:hover,.runhead nav.site [aria-current="page"]{color:var(--ink);border-color:var(--rule)}

/* ---------- problem-set header ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.ps-head{padding-top:40px}
.ps-title{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:24px;padding-bottom:18px;border-bottom:2px solid var(--rule-strong)}
.ps-title h1{margin:0;font:500 clamp(34px,4.6vw,56px)/1 var(--ui);letter-spacing:-.035em;color:var(--ink)}
.ps-title h1 span{font-family:var(--mono);font-weight:500;color:var(--teal);letter-spacing:-.04em;margin-left:.1em}
.ps-no{font:500 13px/1.3 var(--mono);color:var(--muted);text-align:right}
.ps-no b{display:block;font:500 34px/1 var(--mono);color:var(--navy);letter-spacing:-.02em;margin-top:6px}
.ps-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--rule)}
.ps-facts>div{padding:12px 16px 13px;border-left:1px solid var(--rule)}
.ps-facts>div:first-child{border-left:0;padding-left:0}
.ps-facts dt{font:500 10px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.ps-facts dd{margin:5px 0 0;font:500 15px/1.35 var(--ui);color:var(--ink)}

/* ---------- workbench ---------- */
.bench{display:grid;grid-template-columns:230px minmax(0,1fr);gap:48px;padding-top:34px;padding-bottom:90px;align-items:start}
.side{position:sticky;top:84px}
.side h2{font:500 10px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 12px}
.navgrid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule-strong);border-left:1px solid var(--rule-strong)}
.navgrid button{position:relative;aspect-ratio:1;border:0;border-right:1px solid var(--rule-strong);border-bottom:1px solid var(--rule-strong);background:var(--sheet);font:500 15px/1 var(--mono);color:var(--muted);display:grid;place-items:center}
.navgrid button[data-state="answered"]{color:var(--ink);background:var(--teal-wash)}
.navgrid button[data-state="answered"]::after{content:"";position:absolute;right:6px;top:6px;width:6px;height:6px;background:var(--teal)}
.navgrid button[data-state="right"]{background:var(--right-wash);color:var(--right)}
.navgrid button[data-state="wrong"]{background:var(--wrong-wash);color:var(--wrong)}
.navgrid button[aria-current="step"]{outline:2px solid var(--navy);outline-offset:-3px;color:var(--ink)}
.meter{margin:16px 0 0;font:500 12px/1.4 var(--mono);color:var(--muted);display:flex;justify-content:space-between}
.meter-bar{height:4px;background:var(--rule);margin-top:8px}
.meter-bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .2s ease}
.keys{margin:26px 0 0;padding:14px 0 0;border-top:1px solid var(--rule);font:12px/1.9 var(--mono);color:var(--muted)}
.keys kbd{font:500 11px/1 var(--mono);border:1px solid var(--rule);border-bottom-width:2px;padding:2px 5px;background:var(--sheet);color:var(--ink)}

.sheet{background:var(--sheet);border:1px solid var(--rule-strong);box-shadow:6px 6px 0 rgba(28,47,74,.07);min-width:0}

/* ---------- question ---------- */
.q{padding:34px 40px 30px}
.q-head{display:flex;align-items:baseline;gap:18px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.q-num{font:500 36px/.95 var(--mono);color:var(--navy);letter-spacing:-.04em}
.q-field{font:500 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--teal)}
.q-kind{margin-left:auto;font:500 11px/1.4 var(--mono);color:var(--muted);white-space:nowrap}
.stem{font:400 20px/1.6 var(--math);color:var(--ink);margin:24px 0 0;max-width:68ch}
.stem p{margin:0 0 14px}
.stem i,.opt-text i,.expl i{font-style:italic}
.exhibit{margin:18px 0 6px}
.exhibit-cap{font:500 10px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:6px}
table.data{border-collapse:collapse;font:14px/1.4 var(--mono);min-width:min(100%,460px)}
table.data th,table.data td{padding:7px 14px 7px 0;text-align:right;border-bottom:1px solid var(--rule)}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data thead th{font-weight:500;color:var(--muted);border-bottom:1.5px solid var(--ink);font-size:12px}
.console{background:#1b2027;box-shadow:inset 0 0 0 1px var(--console-edge,transparent);color:#dfe5ea;font:13px/1.65 var(--mono);padding:14px 16px;overflow-x:auto;white-space:pre;border-left:3px solid var(--teal)}
.console .p{color:#7fb7c2}.console .c{color:#8b949e}
.eq{font:400 21px/1.5 var(--math);text-align:center;padding:12px 0;color:var(--ink)}
.eq sub,.eq sup{font-size:.7em}

.prompt{margin:22px 0 10px;font:500 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.opts{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;align-items:start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:14px 10px 14px 4px;transition:background .12s}
.opt:hover{background:rgba(14,83,96,.045)}
.opt .key{width:28px;height:28px;display:grid;place-items:center;border:1.5px solid var(--ink);font:500 13px/1 var(--mono);color:var(--ink);background:var(--sheet)}
.opts[data-kind="single"] .key,.opts[data-kind="tf"] .key{border-radius:50%}
.opt-text{font:400 17px/1.55 var(--math);color:var(--text);padding-top:1px}
.opt[aria-checked="true"]{background:var(--teal-wash)}
.opt[aria-checked="true"] .key{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}
.opt[aria-checked="true"] .opt-text{color:var(--ink)}

.q-foot{display:flex;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:var(--sheet);padding:11px 16px;font:500 13px/1 var(--ui);letter-spacing:.01em;color:var(--ink)}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-accent)}
.btn.primary:hover{background:var(--teal);border-color:var(--teal)}
.btn:disabled{opacity:.38;cursor:not-allowed;background:var(--sheet);color:var(--ink)}
.btn.primary:disabled{background:var(--navy);color:var(--on-accent)}
.q-foot .spacer{flex:1}
.hint{font:12px/1.4 var(--mono);color:var(--muted)}

/* ---------- results ---------- */
.results{padding:34px 40px 40px}
.res-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:end;padding-bottom:22px;border-bottom:2px solid var(--rule-strong)}
.score{font:500 84px/.85 var(--mono);color:var(--navy);letter-spacing:-.06em}
.score small{font-size:.42em;color:var(--muted);letter-spacing:-.02em}
.res-top h2{margin:0 0 6px;font:500 28px/1.15 var(--ui);letter-spacing:-.02em;color:var(--ink)}
.res-top p{margin:0;color:var(--muted);font-size:14px}
.res-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;margin:26px 0 8px}
.res-cols h3,.solutions>h3{font:500 10px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}
table.tally{width:100%;border-collapse:collapse;font:13px/1.4 var(--mono)}
table.tally td{padding:8px 0;border-bottom:1px solid var(--rule)}
table.tally td:last-child{text-align:right;white-space:nowrap}
table.tally .miss{color:var(--wrong)}
.review{list-style:none;margin:0;padding:0}
.review li{padding:10px 0;border-bottom:1px solid var(--rule)}
.review b{display:block;font:500 15px/1.3 var(--ui);color:var(--ink)}
.review span{display:block;font:14px/1.5 var(--math);color:var(--text);margin-top:3px}
.review .src{display:block;font:11px/1.5 var(--mono);color:var(--muted);margin-top:4px}.review a.src{color:var(--teal)}
.clean{font:16px/1.55 var(--math);color:var(--text);margin:0}
.solutions{margin-top:34px}
.sol{border-top:1px solid var(--rule-strong);padding:24px 0 8px;scroll-margin-top:72px}
.sol-head{display:flex;gap:14px;align-items:baseline}
.sol-head .q-num{font-size:28px}
.mark{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;padding:5px 0}
.mark.right{color:var(--right)}.mark.wrong{color:var(--wrong)}
.sol .stem{font-size:17px;margin-top:12px}
.sol .opts{margin-top:10px}
.sol .opt{cursor:default;padding:10px 8px 10px 4px}
.sol .opt:hover{background:transparent}
.sol .opt .key{width:24px;height:24px;font-size:12px}
.sol .opt-text{font-size:15.5px}
.sol .opt.is-correct{background:var(--right-wash)}
.sol .opt.is-correct .key{background:var(--right);border-color:var(--right);color:var(--on-accent)}
.sol .opt.is-picked-wrong{background:var(--wrong-wash)}
.sol .opt.is-picked-wrong .key{background:var(--wrong);border-color:var(--wrong);color:var(--on-accent)}
.sol .opt .tag{display:block;font:500 10px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-top:4px;color:var(--muted)}
.expl{margin:16px 0 10px;padding:14px 0 0 18px;border-left:2px solid var(--teal);font:16px/1.65 var(--math);color:var(--text);max-width:70ch}
.expl p{margin:0 0 10px}
.expl .expl-h{font:500 10px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--teal);margin-bottom:8px}
.refs{font:12px/1.6 var(--mono);color:var(--muted);margin:0 0 14px 20px}
.res-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px;padding-top:20px;border-top:2px solid var(--rule-strong)}

/* ---------- archive ---------- */
.archive{padding:34px 40px 40px}
.archive h2{margin:0;font:500 30px/1.1 var(--ui);letter-spacing:-.025em;color:var(--ink)}
.archive > p{margin:8px 0 22px;color:var(--muted);font-size:14px}
table.index{width:100%;border-collapse:collapse}
table.index th{font:500 10px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-align:left;padding:0 16px 8px 0;border-bottom:1.5px solid var(--ink)}
table.index td{padding:14px 16px 14px 0;border-bottom:1px solid var(--rule);vertical-align:top}
table.index td.no{font:500 22px/1 var(--mono);color:var(--navy);white-space:nowrap}
table.index td.date{white-space:nowrap}table.index td.date a{font:500 16px/1.3 var(--ui);color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
table.index td.date a:hover{border-color:var(--teal);color:var(--teal)}
table.index td.date small{display:block;font:12px/1.4 var(--mono);color:var(--muted);margin-top:4px}
table.index td.fields{font:14px/1.5 var(--math);color:var(--text)}
table.index td.mine{font:500 14px/1 var(--mono);white-space:nowrap;text-align:right}
table.index th:last-child{text-align:right}
table.index tr[aria-current="true"] td.no{color:var(--teal)}

.foot{max-width:1180px;margin:0 auto;padding:18px 28px 40px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:20px;font:12px/1.6 var(--mono);color:var(--muted)}
.foot a{color:var(--muted)}

@media (max-width:900px){
  .bench{grid-template-columns:1fr;gap:18px;padding-top:22px}
  .side{position:static}
  .navgrid{grid-template-columns:repeat(8,1fr)}
  .navgrid button{aspect-ratio:auto;height:44px}
  .keys{display:none}
  .ps-facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ps-facts>div:nth-child(3){border-left:0;padding-left:0}
  .ps-facts>div:nth-child(n+3){border-top:1px solid var(--rule)}
  .res-cols{grid-template-columns:1fr;gap:26px}
}
@media (max-width:600px){
  .wrap,.runhead-inner{padding-left:16px;padding-right:16px}
  .runhead-inner{gap:10px}
  .wordmark{font-size:17px}
  .pd-imprint .lbl{display:none}
  .pd-row{padding:16px 16px 0;overflow-x:auto}
  .pd-note{display:none}
  .runhead nav.site a{padding:8px 4px;font-size:11px}
  .ps-head{padding-top:26px}
  .ps-title{grid-template-columns:1fr;gap:10px}
  .ps-no{text-align:left;display:flex;align-items:baseline;gap:10px}
  .ps-no b{font-size:24px;margin:0}
  .sheet{box-shadow:none;margin:0 -16px;border-left:0;border-right:0}
  .q,.results,.archive{padding:24px 16px 26px}
  .q-num{font-size:34px}
  .q-head{flex-wrap:wrap;gap:6px 14px}
  .q-kind{margin-left:0;width:100%}
  .stem{font-size:18px}
  .opt-text{font-size:16px}
  .opt{grid-template-columns:30px minmax(0,1fr);gap:10px}
  .console{font-size:12px}
  .q-foot .btn{flex:1}
  .q-foot .spacer{display:none}
  .hint{width:100%;order:-1}
  .res-top{grid-template-columns:1fr;gap:14px}
  .score{font-size:64px}
  table.index td.fields{display:none}
  table.index th:nth-child(3){display:none}
  .foot{flex-direction:column;padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{
  body{background:#fff}
  .runhead,.side,.q-foot,.res-actions,.foot{display:none}
  .bench{display:block;padding:0}
  .sheet{border:0;box-shadow:none}
  .sol{break-inside:avoid}
}

/* masthead */
.ps-title h1{font:italic 400 clamp(46px,6.4vw,84px)/.92 var(--math)!important;letter-spacing:-.02em!important}
.ps-title h1 i{color:var(--teal)}
.ps-no{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ps-no span{font:500 10px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.ps-no b{font:500 clamp(30px,3.6vw,46px)/1 var(--mono)!important;color:var(--navy);letter-spacing:-.04em;margin:0!important}
/* record strips */
.record{display:inline-flex;gap:3px;vertical-align:-2px;margin-left:8px}
.record i{width:11px;height:11px;border:1.5px solid var(--ink);background:var(--sheet)}
.record i.a{background:var(--teal-wash)}
.record i.r{background:var(--right);border-color:var(--right)}
.record i.w{background:var(--sheet);border-color:var(--wrong);background-image:linear-gradient(45deg,transparent 45%,var(--wrong) 45% 55%,transparent 55%)}
.record.big{display:flex;margin:10px 0 12px;gap:5px}
.record.big i{width:22px;height:22px}
td.mine .record{margin:0 10px 0 0}
td.mine b{font-weight:500}
.ledger-note{margin:14px 0 0;font:12px/1.5 var(--mono);color:var(--muted)}
/* Periodicals shelf (The Workbook dress) */
.pd-imprint{display:flex;align-items:center;gap:8px;background:none;border:0;padding:8px 0;font:500 12px/1 var(--mono);color:var(--muted);letter-spacing:.02em}
.pd-imprint svg{width:16px;height:14px}
.pd-imprint:hover,.pd-imprint[aria-expanded="true"]{color:var(--ink)}
.pd-drawer{position:absolute;left:0;right:0;top:100%;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;border-bottom:1.5px solid var(--ink);opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .18s,transform .18s,visibility 0s .18s}
.pd-drawer[data-open="true"]{opacity:1;visibility:visible;transform:none;transition:opacity .18s,transform .18s}
.pd-row{max-width:1180px;margin:0 auto;padding:22px 28px 0;display:flex;align-items:flex-end;gap:8px;border-bottom:4px solid var(--ink)}
.pd-spine{--w:58px;--h:188px;width:var(--w);height:var(--h);background:var(--c);color:var(--on);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 0;border:1.5px solid var(--ink);border-bottom:0;transition:transform .2s cubic-bezier(.2,.7,.2,1)}

          "correct": [2],
          "concepts": ["Hotelling rule"],
          "explanation": "<p>With zero extraction cost, Hotelling's rule makes the price (the scarcity rent) grow at the interest rate: <i>p<sub>t</sub></i> = <i>p</i><sub>0</sub><i>e<sup>rt</sup></i>. A higher <i>r</i> makes the path steeper. The same total stock must still be exhausted, so a steeper path must start lower and cross the old path from below. The result is more extraction today, less later, and earlier exhaustion. Intuitively, a higher return on financial assets makes resources in the ground a worse store of value, so owners extract and sell sooner.</p><p>(A) ignores the timing margin. (B) reverses the logic: heavier discounting makes owners want revenue <i>sooner</i>. (D) contradicts the rule itself, since the growth rate equals <i>r</i>.</p>",
          "refs": "Hotelling (1931), JPE; Dasgupta & Heal (1979), ch. 6"
        }
      ]
    }
  ]
}
</script>
<script>
(function(){
  'use strict';
  var DATA = JSON.parse(document.getElementById('challenge-data').textContent);
  var EDITIONS = DATA.editions.slice().sort(function(a,b){return b.date.localeCompare(a.date)});
  var LETTERS = 'ABCDEFGH';
  var app = document.getElementById('app');
  var KEY = 'dec:v1:';
  var ed = null, st = null;

  function load(date){try{var r=localStorage.getItem(KEY+date);return r?JSON.parse(r):null}catch(e){return null}}
  function save(){try{localStorage.setItem(KEY+ed.date,JSON.stringify(st))}catch(e){}}
  function fresh(){return {answers:{},current:0,submitted:false}}
  function pad(n){return String(n).padStart(3,'0')}
  function dateObj(d){return new Date(d+'T12:00:00')}
  function longDate(d){return dateObj(d).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
  function shortDate(d){return dateObj(d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
  function kindLabel(k){return k==='multi'?'Select all that apply':k==='tf'?'True or false':'Select one'}
  function kindShort(k){return k==='multi'?'multi-select':k==='tf'?'true / false':'single-select'}
  function same(a,b){a=(a||[]).slice().sort();b=b.slice().sort();return a.length===b.length&&a.every(function(v,i){return v===b[i]})}
  function isRight(q){return same(st.answers[q.id],q.correct)}
  function answered(q){return (st.answers[q.id]||[]).length>0}
  function nAnswered(){return ed.questions.filter(answered).length}
  function fields(e){var s=[];e.questions.forEach(function(q){if(s.indexOf(q.field)<0)s.push(q.field)});return s}
  function scoreOf(e,s){return e.questions.filter(function(q){return same((s.answers||{})[q.id],q.correct)}).length}

  function exhibitHTML(x){
    if(!x)return '';
    var cap='<div class="exhibit-cap">'+x.caption+'</div>';
    if(x.type==='table'){
      return '<div class="exhibit">'+cap+'<div style="overflow-x:auto"><table class="data"><thead><tr>'+x.head.map(function(h){return '<th scope="col">'+h+'</th>'}).join('')+'</tr></thead><tbody>'+x.rows.map(function(r){return '<tr>'+r.map(function(c,i){return i?'<td>'+c+'</td>':'<th scope="row" style="font-weight:400">'+c+'</th>'}).join('')+'</tr>'}).join('')+'</tbody></table></div></div>';
    }
    if(x.type==='console')return '<div class="exhibit">'+cap+'<div class="console" role="figure" aria-label="R console input">'+x.code+'</div></div>';
    if(x.type==='eq')return '<div class="exhibit">'+cap+'<div class="eq">'+x.html+'</div></div>';
    return '';
  }

  function recordHTML(e,sv,cls){
    return '<span class="'+(cls||'record')+'" aria-hidden="true">'+e.questions.map(function(q){var a=sv&&sv.answers&&sv.answers[q.id];var c='';
      if(sv&&sv.submitted)c=same(a,q.correct)?'r':'w';else if(a&&a.length)c='a';return '<i class="'+c+'"></i>'}).join('')+'</span>';
  }
  var DOWN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function nextSet(){
    var p={};new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',minute:'numeric',hour12:false}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});
    var dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday),mins=(+p.hour%24)*60+(+p.minute);
    for(var k=0;k<8;k++){var d=(dow+k)%7;if(d===0||d===6)continue;var until=k*1440+600-mins;if(until<=0)continue;
      if(until<=720){var h=Math.floor(until/60),m=until%60;return (h?h+' h ':'')+String(m).padStart(h?2:1,'0')+' min'}
      return (k===1?'Tomorrow':DOWN[d])+', 10:00'}
    return '';
  }
  function headHTML(){
    var latest=EDITIONS[0]===ed,n=ed.questions.length,sc=scoreOf(ed,st);
    var rec=st.submitted?sc+' / '+n+' '+recordHTML(ed,st):nAnswered()?nAnswered()+' of '+n+' answered':'Not started';
    return '<section class="wrap ps-head" aria-labelledby="psTitle"><div class="ps-title"><h1 id="psTitle">The <i>Workbook</i></h1><div class="ps-no"><b class="ps-folio"><span class="no">N<sup>o</sup>.</span>'+pad(ed.no)+'</b><span>'+(latest?'Today’s set':'From the ledger')+'</span><em class="sub">Economics &amp; econometrics · weekdays</em></div></div>'+
      '<dl class="ps-facts"><div><dt>Set</dt><dd><time datetime="'+ed.date+'">'+longDate(ed.date)+'</time></dd></div><div><dt>Questions</dt><dd>'+n+' · about '+ed.minutes+' min</dd></div><div><dt>Your record</dt><dd id="statusFact">'+rec+'</dd></div><div><dt>Next set</dt><dd id="nextSet">'+nextSet()+'</dd></div></dl></section>';
  }

  function sideHTML(){
    return '<aside class="side" aria-label="Question navigator"><h2>Questions</h2><div class="navgrid" role="list">'+
      ed.questions.map(function(q,i){
        var s=st.submitted?(isRight(q)?'right':'wrong'):(answered(q)?'answered':'open');
        var lab='Question '+(i+1)+(st.submitted?(s==='right'?', correct':', incorrect'):(answered(q)?', answered':', not answered'));
        return '<button type="button" role="listitem" data-go="'+i+'" data-state="'+s+'" aria-label="'+lab+'"'+(!st.submitted&&i===st.current?' aria-current="step"':'')+'>'+(i+1)+'</button>'
      }).join('')+'</div>'+
      '<div class="meter"><span>'+(st.submitted?'Score':'Answered')+'</span><span>'+(st.submitted?scoreOf(ed,st):nAnswered())+' / '+ed.questions.length+'</span></div><div class="meter-bar"><i style="width:'+(100*(st.submitted?scoreOf(ed,st):nAnswered())/ed.questions.length)+'%"></i></div>'+
      '<div class="keys"><kbd>A</kbd>–<kbd>D</kbd> choose<br><kbd>←</kbd> <kbd>→</kbd> previous / next<br><kbd>Enter</kbd> next or submit</div></aside>';
  }

  function optsHTML(q,review){
    var picked=st.answers[q.id]||[];
    return '<ul class="opts" data-kind="'+q.kind+'" role="'+(q.kind==='multi'?'group':'radiogroup')+'" aria-label="'+kindLabel(q.kind)+'">'+q.options.map(function(o,i){
      var on=picked.indexOf(i)>=0, cls='opt', tag='';
      if(review){
        var c=q.correct.indexOf(i)>=0;
        if(c)cls+=' is-correct';
        if(on&&!c)cls+=' is-picked-wrong';
        tag=on&&c?'Your answer · correct':on?'Your answer':c?'Correct answer':'';
      }
      var inner='<span class="key" aria-hidden="true">'+(q.kind==='tf'?o.charAt(0):LETTERS[i])+'</span><span class="opt-text">'+o+(tag?'<span class="tag">'+tag+'</span>':'')+'</span>';
      if(review)return '<li class="'+cls+'">'+inner+'</li>';
      return '<li><button type="button" class="'+cls+'" role="'+(q.kind==='multi'?'checkbox':'radio')+'" aria-checked="'+on+'" data-opt="'+i+'">'+inner+'</button></li>';
    }).join('')+'</ul>';
  }

  function questionHTML(){
    var i=st.current,q=ed.questions[i],last=i===ed.questions.length-1,remaining=ed.questions.length-nAnswered();
    return '<article class="sheet q" aria-labelledby="qlabel"><header class="q-head"><span class="q-num" id="qlabel" aria-label="Question '+(i+1)+'">Q'+(i+1)+'</span><span class="q-field">'+q.field+'</span><span class="q-kind">'+(i+1)+' / '+ed.questions.length+' · '+kindShort(q.kind)+'</span></header>'+
      '<div class="stem">'+q.stem+'</div>'+exhibitHTML(q.exhibit)+(q.after?'<div class="stem" style="margin-top:14px">'+q.after+'</div>':'')+
      '<div class="prompt">'+kindLabel(q.kind)+'</div>'+optsHTML(q,false)+
      '<div class="q-foot"><button type="button" class="btn" data-act="prev"'+(i===0?' disabled':'')+'>← Previous</button><span class="spacer"></span>'+
      (last?'<span class="hint">'+(remaining?remaining+' unanswered':'All questions answered')+'</span><button type="button" class="btn primary" data-act="submit"'+(remaining?' disabled':'')+'>Submit for solutions</button>':'<button type="button" class="btn primary" data-act="next">Next →</button>')+
      '</div></article>';
  }

  function resultsHTML(){
    var n=ed.questions.length,sc=scoreOf(ed,st),byField={},missed=[];
    ed.questions.forEach(function(q,i){
      var f=byField[q.field]||(byField[q.field]={r:0,t:0});f.t++;
      if(isRight(q))f.r++;else q.concepts.forEach(function(c){missed.push({c:c,q:i+1,refs:q.refs})});
    });
    var seen={};missed=missed.filter(function(m){if(seen[m.c])return false;seen[m.c]=1;return true});
    var verdict=sc===n?'Every question correct.':sc>=n-2?'A strong set; review the misses below.':'Worth a second pass through the solutions below.';
    return '<article class="sheet results" aria-labelledby="resTitle"><div class="res-top"><div class="score" aria-label="Score '+sc+' of '+n+'">'+sc+'<small>/'+n+'</small></div><div><h2 id="resTitle"><span class="no">N<sup>o</sup>.</span>'+pad(ed.no)+' · solutions</h2>'+recordHTML(ed,st,'record big')+'<p>'+verdict+' A multi-select question counts only when exactly the correct options are chosen.</p></div></div>'+
      '<div class="res-cols"><div><h3>By field</h3><table class="tally"><tbody>'+Object.keys(byField).map(function(k){var f=byField[k];return '<tr><td>'+k+'</td><td'+(f.r<f.t?' class="miss"':'')+'>'+f.r+' / '+f.t+'</td></tr>'}).join('')+'</tbody></table></div>'+
      '<div><h3>Concepts to review</h3>'+(missed.length?'<ul class="review">'+missed.map(function(m){return '<li><b>'+m.c+'</b><a class="src" href="#sol-'+m.q+'" data-sol="'+m.q+'">Question '+m.q+' solution ↓</a><span class="src">'+m.refs+'</span></li>'}).join('')+'</ul>':'<p class="clean">Nothing flagged this time. The references under each solution are the natural next reading.</p>')+'</div></div>'+
      '<section class="solutions" aria-label="Worked solutions"><h3>Worked solutions</h3>'+ed.questions.map(function(q,i){
        var r=isRight(q);
        return '<div class="sol" id="sol-'+(i+1)+'"><div class="sol-head"><span class="q-num">Q'+(i+1)+'</span><span class="q-field">'+q.field+'</span><span class="mark '+(r?'right':'wrong')+'" style="margin-left:auto">'+(r?'Correct':'Incorrect')+'</span></div><div class="stem">'+q.stem+'</div>'+exhibitHTML(q.exhibit)+(q.after?'<div class="stem">'+q.after+'</div>':'')+optsHTML(q,true)+'<div class="expl"><div class="expl-h">Reasoning</div>'+q.explanation+'</div><p class="refs">'+q.refs+'</p></div>';
      }).join('')+'</section>'+
      '<div class="res-actions"><button type="button" class="btn primary" data-act="copy">Copy result</button><button type="button" class="btn" data-act="retake">Retake this set</button><a class="btn" href="#archive" style="text-decoration:none">Ledger</a><span class="hint" id="copyNote" aria-live="polite"></span></div></article>';
  }

  function archiveHTML(){
    var done=0,right=0,tot=0;EDITIONS.forEach(function(e){var v=load(e.date);if(v&&v.submitted){done++;right+=scoreOf(e,v);tot+=e.questions.length}});
    return '<section class="wrap ps-head"><div class="ps-title"><h1 id="psTitle">The <i>Ledger</i></h1><div class="ps-no"><span>Sets worked</span><b>'+done+'&thinsp;/&thinsp;'+EDITIONS.length+'</b></div></div>'+
      '<dl class="ps-facts"><div><dt>Published</dt><dd>'+EDITIONS.length+' '+(EDITIONS.length===1?'set':'sets')+'</dd></div><div><dt>Questions right</dt><dd>'+(tot?right+' of '+tot:'—')+'</dd></div><div><dt>Accuracy</dt><dd>'+(tot?Math.round(100*right/tot)+'%':'—')+'</dd></div><div><dt>Next set</dt><dd id="nextSet">'+nextSet()+'</dd></div></dl></section>'+
      '<div class="wrap" style="padding-top:28px;padding-bottom:80px"><article class="sheet archive" aria-labelledby="arcTitle"><h2 id="arcTitle" class="sr-only">Problem sets</h2>'+
      '<table class="index"><thead><tr><th scope="col">No.</th><th scope="col">Set</th><th scope="col">Fields</th><th scope="col">Record</th></tr></thead><tbody>'+
      EDITIONS.map(function(e,i){var v=load(e.date),mine=v&&v.submitted?'<b>'+scoreOf(e,v)+'/'+e.questions.length+'</b>':v&&Object.keys(v.answers||{}).length?'<b>…</b>':'<b>—</b>';
        return '<tr'+(i===0?' aria-current="true"':'')+'><td class="no">'+pad(e.no)+'</td><td class="date"><a href="#'+e.date+'">'+shortDate(e.date)+'</a><small>'+e.questions.length+' questions'+(i===0?' · today':'')+'</small></td><td class="fields">'+fields(e).join(', ')+'</td><td class="mine">'+recordHTML(e,v)+mine+'</td></tr>'}).join('')+
      '</tbody></table><p class="ledger-note">Records live in this browser.</p></article></div>';
  }

  function render(focusMain){
    document.getElementById('archiveLink').setAttribute('aria-current',location.hash==='#archive'?'page':'false');
    if(location.hash==='#archive'){
      document.title='The Ledger · The Workbook';
      document.body.classList.add('ledger');
      app.innerHTML=archiveHTML();
      return;
    }
    document.title='The Workbook No. '+pad(ed.no);document.body.classList.remove('ledger');
    app.innerHTML=headHTML()+'<div class="wrap bench" id="bench">'+sideHTML()+'<div class="main-col" id="mainCol">'+(st.submitted?resultsHTML():questionHTML())+'</div></div>';
    if(focusMain){var h=app.querySelector('.q-num,.score');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}}
  }

  function go(i,focus){st.current=Math.max(0,Math.min(ed.questions.length-1,i));save();render(focus);
    var b=document.getElementById('bench');if(b&&b.getBoundingClientRect().top<0)b.scrollIntoView({block:'start'})}

  function pick(i){
    var q=ed.questions[st.current],cur=(st.answers[q.id]||[]).slice();
    if(q.kind==='multi'){var k=cur.indexOf(i);if(k>=0)cur.splice(k,1);else cur.push(i);cur.sort()}
    else cur=[i];
    st.answers[q.id]=cur;save();render();
    var btn=app.querySelector('[data-opt="'+i+'"]');if(btn)btn.focus({preventScroll:true});
  }

  function submit(){if(nAnswered()<ed.questions.length)return;st.submitted=true;save();render(true);window.scrollTo(0,0)}

  app.addEventListener('click',function(e){
    var sl=e.target.closest('[data-sol]');if(sl){e.preventDefault();var el=document.getElementById('sol-'+sl.dataset.sol);if(el)el.scrollIntoView({block:'start'});return}
    var t=e.target.closest('[data-opt],[data-act],[data-go]');if(!t)return;
    if(t.dataset.opt!=null)return pick(+t.dataset.opt);
    if(t.dataset.go!=null){if(st.submitted){var s=document.getElementById('sol-'+(+t.dataset.go+1));if(s)s.scrollIntoView({block:'start'});return}return go(+t.dataset.go,true)}
    var a=t.dataset.act;
    if(a==='prev')go(st.current-1,true);
    if(a==='next')go(st.current+1,true);
    if(a==='submit')submit();
    if(a==='retake'){st=fresh();save();render(true);window.scrollTo(0,0)}
    if(a==='copy'){var txt='The Workbook No. '+pad(ed.no)+' · '+scoreOf(ed,st)+'/'+ed.questions.length+'\n'+ed.questions.map(function(q){return isRight(q)?'■':'□'}).join('')+'\n'+location.href.split('#')[0]+'#'+ed.date;
      var note=document.getElementById('copyNote');
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){note.textContent='Copied'},function(){note.textContent=txt.split('\n').slice(0,2).join('  ')});}
  });

  document.addEventListener('keydown',function(e){
    if(location.hash==='#archive'||st.submitted||e.metaKey||e.ctrlKey||e.altKey)return;
    if(/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||'')))return;
    var q=ed.questions[st.current],k=e.key.toUpperCase();
    if(q.kind==='tf'&&(k==='T'||k==='F')){e.preventDefault();return pick(k==='T'?0:1)}
    var idx=LETTERS.indexOf(k);
    if(k.length===1&&idx>=0&&idx<q.options.length){e.preventDefault();return pick(idx)}
    if(e.key==='ArrowRight'){e.preventDefault();go(st.current+1,true)}
    else if(e.key==='ArrowLeft'){e.preventDefault();go(st.current-1,true)}
    else if(e.key==='Enter'&&(e.target===document.body||e.target.classList.contains('q-num'))){
      if(!answered(q))return;e.preventDefault();
      if(st.current===ed.questions.length-1)submit();else go(st.current+1,true);
    }
  });

  function route(){
    var h=decodeURIComponent(location.hash.slice(1)),parts=h.split('/');
    if(h!=='archive'){
      var m=EDITIONS.filter(function(e){return e.date===parts[0]})[0]||EDITIONS[0];
      if(!ed||m!==ed){ed=m;st=load(ed.date)||fresh()}
      if(parts[1]){var qi=ed.questions.findIndex(function(q){return q.id===parts[1]});if(qi>=0)st.current=qi}
    } else if(!ed){ed=EDITIONS[0];st=load(ed.date)||fresh()}
    render();window.scrollTo(0,0);
    if(parts[1])setTimeout(function(){var target=parts[2]==='solution'&&st.submitted?document.getElementById('sol-'+(st.current+1)):document.querySelector('.q');if(target)target.scrollIntoView({block:'start'})},0);
  }
  document.getElementById('homeLink').addEventListener('click',function(e){e.preventDefault();location.hash=EDITIONS[0].date});
  window.addEventListener('hashchange',route);
  route();
  /* shared Periodicals reading mode */
  function setMode(m,quiet){document.documentElement.setAttribute('data-mode',m);if(!quiet){try{localStorage.setItem('periodicals:mode',m)}catch(e){}}
    document.querySelectorAll('.dn button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.mode===m))});
    var tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.content=m==='night'?'#10161d':'#f7f7f3'}
  document.querySelectorAll('.dn button').forEach(function(b){b.addEventListener('click',function(){setMode(b.dataset.mode)})});
  setMode(document.documentElement.getAttribute('data-mode')==='night'?'night':'day',true);
  window.addEventListener('storage',function(e){if(e.key==='periodicals:mode'&&(e.newValue==='day'||e.newValue==='night'))setMode(e.newValue,true)});
  setInterval(function(){var n=document.getElementById('nextSet');if(n)n.textContent=nextSet()},30000);
  window.addEventListener('scroll',function(){document.body.classList.toggle('scrolled',scrollY>140)},{passive:true});
  var imp=document.querySelector('.pd-imprint'),dr=document.getElementById('pdDrawer');
  function shelf(o){dr.dataset.open=String(o);imp.setAttribute('aria-expanded',String(o));if(o)dr.querySelector('[aria-current]').focus({preventScroll:true})}
  imp.addEventListener('click',function(e){e.stopPropagation();shelf(dr.dataset.open!=='true')});
  document.addEventListener('click',function(e){if(dr.dataset.open==='true'&&!e.target.closest('.pd-shelf'))shelf(false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&dr.dataset.open==='true'){shelf(false);imp.focus()}});
})();
</script>
<script src="../personal-updates/commonplace/commonplace.js"></script>
