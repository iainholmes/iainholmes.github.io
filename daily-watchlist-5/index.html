    return ordered.findIndex(e=>e.date===ed.date)+1;
  }
  function issueLabel(ed){return String(issueNumber(ed)).padStart(3,'0')}
  function weekdayShort(ed){return ed.displayDate.split(',')[0].slice(0,3).toUpperCase()}
  function render(ed){
    document.title=`Daily Watchlist 5 — ${ed.displayDate}`;
    mount.innerHTML=`<article class="edition"><header class="issue-head"><h1>Daily <i>Briefing</i></h1><div class="issue-meta" aria-label="Edition details"><div><span class="meta-label">Field Brief</span><span class="issue-id"><span class="folio-prefix">No.</span> ${issueLabel(ed)}</span></div><div><span class="meta-label">${esc(ed.displayDate.split(',')[0])}</span><time class="publication-date" datetime="${esc(ed.date)}">${esc(ed.displayDate.replace(/^[A-Za-z]+, /,''))}</time></div><div class="reading"><span class="meta-label">${ed.stories.length} developments</span><span>${esc(ed.readTime)}</span></div></div>${ed.issueTitle ? `<h2 class="issue-title">${esc(ed.issueTitle)}</h2>` : ''}</header><p class="lede"><strong>The signal:</strong> ${esc(ed.deck)}</p>${ed.stories.map(storyHTML).join('')}<section class="signal"><div class="k">The signal across today's five</div><h2>${esc(ed.signalTitle)}</h2>${ed.signal.map(p=>`<p>${esc(p)}</p>`).join('')}</section><footer class="footer"><div><strong>Field Brief</strong><br>AI · climate & energy · U.S. policy · North Carolina & Triangle</div><div>Current edition opens by default.<br>Archive links preserve older briefing dates.</div></footer></article>`;
    [...document.querySelectorAll('.edition-btn')].forEach(b=>b.setAttribute('aria-current',b.dataset.date===ed.date?'true':'false'));
    window.scrollTo({top:0,behavior:'instant'});
  }
  function buildArchive(){
    const byYear={}; data.editions.forEach(e=>(byYear[e.date.slice(0,4)]??=[]).push(e));
    archive.innerHTML=Object.keys(byYear).sort().reverse().map(y=>`<section><div class="year">${y}</div>${byYear[y].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<button class="edition-btn" type="button" data-date="${e.date}"><span class="issue-no" aria-label="Number ${issueLabel(e)}"><span class="folio-prefix">No.</span> ${issueLabel(e)}</span><span class="date">${esc(e.displayDate.replace(/^[A-Za-z]+, /,'').replace(/, \d{4}$/,''))}</span><span class="archive-title">${esc(e.issueTitle || e.stories[0]?.title || e.deck || '')}</span><span class="dek">${weekdayShort(e)} · ${esc(e.readTime)}</span></button>`).join('')}</section>`).join('');
    archive.querySelectorAll('.edition-btn').forEach(btn=>btn.addEventListener('click',()=>{location.hash=btn.dataset.date;closeRail()}));
  }
  function load(){
    const key=location.hash.replace('#','');
    const ed=data.editions.find(e=>e.date===key)||[...data.editions].sort((a,b)=>b.date.localeCompare(a.date))[0];
    if(!ed){mount.innerHTML='<div class="empty">No briefings archived yet.</div>';return}
    render(ed);
  }
  function closeRail(){rail.classList.remove('open');backdrop.classList.remove('show');openBtn.setAttribute('aria-expanded','false')}
  openBtn.addEventListener('click',()=>{rail.classList.add('open');backdrop.classList.add('show');openBtn.setAttribute('aria-expanded','true')});backdrop.addEventListener('click',closeRail);
  document.getElementById('archiveClose').addEventListener('click',()=>{closeRail();openBtn.focus()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape' && rail.classList.contains('open')){closeRail();openBtn.focus()}});
  toggle.addEventListener('click',()=>{dark=!dark;document.documentElement.style.filter=dark?'invert(.90) hue-rotate(175deg) saturate(.72)':'';document.querySelectorAll('img,svg').forEach(el=>el.style.filter=dark?'invert(1) hue-rotate(185deg) saturate(1.15)':'');toggle.innerHTML=`<span class="theme-label">View </span>${dark?'Day':'Night'}`});
  buildArchive();window.addEventListener('hashchange',load);load();
})();
</script>
</body>
</html>
