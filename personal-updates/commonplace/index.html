<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11110f">
<title>Commonplace — Periodicals</title>
<meta name="description" content="A private, browser-local commonplace book for material kept from Periodicals.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Libre+Caslon+Display&family=Literata:opsz,wght@7..72,350;7..72,400;7..72,500&display=swap" rel="stylesheet">
<style>
:root{--ground:#11110f;--ground2:#171612;--paper:#f0e8da;--paper-2:#1a1915;--soft:#c4b9a8;--dim:#8d8579;--rule:#36332d;--hair:#45413a;--gold:#bd9d60;--fb:#b7485e;--ll:#708f7f;--wb:#6fa6bc;--river:#6f9bb0;--clay:#a55d3c;--forest:#708f7f;--sage:#82968a;--pollen:#bd9d60;--ink:#f0e8da;--text:#c4b9a8;--cp-dialog-bg:#1a1915;--cp-dialog-ink:#f0e8da;--display:"Libre Caslon Display",Georgia,serif;--text:"Literata",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}html{background:var(--ground);color-scheme:dark;scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 82% 18%,#18201a 0,transparent 28%),var(--ground);color:var(--paper);font:350 17px/1.7 var(--text);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration-color:var(--dim);text-underline-offset:3px}button,input,select{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.page{width:min(1240px,calc(100% - 72px));margin:auto}.imprint{height:60px;display:flex;justify-content:space-between;align-items:center;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}.imprint a{text-decoration:none}.imprint nav{display:flex;gap:24px}
.mast{min-height:360px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:70px;align-items:end;padding:74px 0 52px}.mast h1{margin:0;font:400 clamp(86px,12vw,166px)/.78 var(--display);letter-spacing:-.045em}.mast p{margin:0 0 20px;font:500 11px/1.7 var(--mono);letter-spacing:.04em;color:var(--soft)}.mast .private{margin-top:18px;color:var(--dim)}
.return{display:grid;grid-template-columns:80px 1fr auto;gap:24px;align-items:start;padding:24px 0 32px;margin-bottom:36px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}.return[hidden]{display:none}.return-k{font:500 11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}.return b{font:400 26px/1.15 var(--display)}.return p{margin:5px 0 0;color:var(--soft);font-size:14px}.return a{font:500 10px/1.4 var(--mono);letter-spacing:.07em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:3px}
.body{display:grid;grid-template-columns:230px minmax(0,1fr);gap:78px;padding-bottom:100px}.rail{position:sticky;top:28px;align-self:start}.rail h2{margin:0 0 20px;font:400 30px/1 var(--display)}.rail label{display:block;margin:18px 0 6px;font:500 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}.rail input,.rail select{width:100%;background:transparent;border:0;border-bottom:1px solid var(--rule);padding:7px 0;color:var(--paper);font:500 12px/1.4 var(--mono)}.rail option{background:#171612}.backup{margin:34px 0 0;font:500 10px/1.55 var(--mono);color:var(--dim)}.tools{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px 14px}.tools button{background:none;border:0;border-bottom:1px solid var(--dim);padding:2px 0;font:500 10px/1.4 var(--mono);letter-spacing:.05em;text-transform:uppercase}.tools button:hover{border-color:var(--gold);color:var(--gold)}#importFile{display:none}#importState{min-height:2.6em;margin-top:10px;font:500 10px/1.4 var(--mono);color:var(--soft)}
.entries{min-width:0}.kept-entry{position:relative;padding:2px 0 58px;margin:0 0 50px}.kept-entry::before{content:"";position:absolute;left:-26px;top:6px;width:4px;height:44px;background:var(--dim)}.kept-entry[data-pub="fb"]::before{background:var(--fb)}.kept-entry[data-pub="ll"]::before{background:var(--ll)}.kept-entry[data-pub="wb"]::before{background:var(--wb)}
.kept-meta{display:flex;justify-content:space-between;gap:20px;font:500 10px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}.kept-entry h2{margin:9px 0 12px;font:400 clamp(32px,4vw,50px)/.98 var(--display);letter-spacing:-.025em}.cp-media{max-width:680px;margin:18px 0 22px;color:var(--paper)}.cp-media figure{margin:0}.cp-media svg,.cp-media img{display:block;max-width:100%;height:auto}.cp-media figcaption{margin-top:7px;font:500 10px/1.5 var(--mono);color:var(--dim)}.kept-excerpt{max-width:68ch;margin:0;color:var(--soft)}.cp-threads{margin:14px 0 0;font-style:italic;color:#d7cbb8}.kept-entry blockquote{margin:20px 0 0;padding:0 0 0 20px;border-left:2px solid var(--gold);font:400 18px/1.55 var(--text);color:var(--paper)}.kept-links{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:20px;align-items:baseline}.kept-links a,.kept-links button{background:none;border:0;border-bottom:1px solid var(--rule);padding:2px 0;color:var(--soft);font:500 10px/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase;text-decoration:none}.kept-links a:first-child{color:var(--paper);border-color:var(--gold)}.kept-links button:hover,.kept-links a:hover{color:var(--gold)}.cp-empty{font:italic 400 24px/1.4 var(--display);color:var(--soft)}
.colophon{display:flex;justify-content:space-between;gap:20px;padding:28px 0 56px;border-top:1px solid var(--rule);font:500 10px/1.5 var(--mono);color:var(--dim)}.colophon a{text-decoration:none}
@media(max-width:900px){.page{width:calc(100% - 34px)}.mast{grid-template-columns:1fr;min-height:300px;gap:18px;padding:50px 0 38px}.mast h1{font-size:clamp(74px,19vw,120px)}.body{grid-template-columns:1fr;gap:44px}.rail{position:static;display:grid;grid-template-columns:1fr 1fr;gap:0 24px}.rail h2,.backup,.tools,#importState{grid-column:1/-1}.return{grid-template-columns:1fr;gap:8px}.return a{justify-self:start}.kept-entry{margin-left:22px}}
@media(max-width:560px){.imprint nav{gap:12px}.mast{min-height:260px}.body{padding-bottom:60px}.rail{grid-template-columns:1fr}.rail h2,.backup,.tools,#importState{grid-column:auto}.kept-meta{display:block}.kept-meta span{display:block}.kept-entry h2{font-size:36px}.kept-entry::before{left:-18px}.colophon{display:block}.colophon span{display:block;margin-top:8px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{body{background:#fff;color:#111}.imprint,.rail,.return,.colophon{display:none}.page{width:auto}.body{display:block}.kept-entry{break-inside:avoid}.kept-entry::before{background:#777}.kept-excerpt,.kept-entry blockquote{color:#222}}

/* 2026-09-29 — Commonplace as an editorial index, not a generic settings panel. */
.mast-state{align-self:end;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;padding-bottom:8px;font:500 10px/1.45 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.mast-state b{display:block;margin-bottom:4px;font:400 34px/.9 var(--display);letter-spacing:-.035em;text-transform:none;color:var(--paper)}
.mast-state #localState{grid-column:1/-1;color:var(--soft);text-transform:none;letter-spacing:.03em}
.rail{padding-left:24px}.rail::before{content:"";position:absolute;left:3px;top:78px;bottom:118px;width:2px;background:linear-gradient(var(--gold),var(--rule) 68%,transparent)}
.rail-title{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 28px;padding:0}
.rail-title>span{font:italic 400 28px/1.05 var(--text);letter-spacing:-.015em;color:var(--paper)}.rail-title small{font:500 9px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.search-line{display:block!important;margin:0 0 30px!important;position:relative}.search-line::before{content:"↳";position:absolute;left:-23px;bottom:9px;color:var(--gold);font:400 13px/1 var(--mono)}.search-line>span{display:block;margin:0 0 3px;font:500 8.5px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.search-line input{font:italic 400 15px/1.4 var(--text)!important;padding:7px 0 9px!important}
.index-line{display:grid;grid-template-columns:48px minmax(0,1fr);grid-template-rows:auto auto;column-gap:12px;align-items:end;padding:11px 0 16px;position:relative;border:0!important}.index-line::before{content:"";position:absolute;left:-24px;top:23px;width:8px;height:8px;border:1px solid var(--gold);background:var(--ground);transform:rotate(45deg)}
.index-line label{grid-column:1;grid-row:1/3;margin:0!important;font:500 8px/1.3 var(--mono)!important;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)!important}.index-line label span{display:block;width:auto;margin:0 0 5px;font:italic 400 24px/.9 var(--text);letter-spacing:-.03em;color:var(--gold);text-transform:none}
.index-line select{grid-column:2;grid-row:1/3;appearance:none;background:transparent!important;border:0!important;border-bottom:1px solid var(--hair)!important;padding:5px 20px 7px 0!important;text-align:left;font:400 13px/1.35 var(--mono)!important;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%)!important;background-position:calc(100% - 6px) 55%,calc(100% - 2px) 55%!important;background-size:4px 4px,4px 4px!important;background-repeat:no-repeat!important}
.index-line select:focus{border-bottom-color:var(--gold)!important}.carry{margin-top:32px;padding-top:14px;position:relative;border-top:0!important}.carry::before{content:"";position:absolute;left:0;top:0;width:72px;height:5px;background:var(--rule)}
.carry summary{list-style:none;cursor:pointer;font:500 10px/1.4 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--soft)}
.carry summary::-webkit-details-marker{display:none}.carry summary::after{content:" +";color:var(--gold)}.carry[open] summary::after{content:" −"}
.carry .backup{margin:16px 0 0}.carry .tools{margin-top:14px}
.clear-book{margin-top:22px;background:none;border:0;border-bottom:1px solid #7e5b55;padding:2px 0;color:#b9948b;font:500 9px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase}.clear-book:hover{color:var(--paper);border-color:var(--paper)}
@media(max-width:900px){.mast-state{max-width:360px}.rail-title,.search-line,.carry{grid-column:1/-1}.index-line{grid-template-columns:84px 1fr}}
@media(max-width:560px){.mast-state{grid-template-columns:1fr 1fr}.rail{display:block!important;padding-left:20px}.rail::before{left:2px}.index-line{grid-template-columns:44px 1fr}.index-line::before{left:-20px}.search-line::before{left:-19px}}
</style>
</head>
<body data-commonplace-page>
<div class="page">
<header class="imprint"><a href="../">← Periodicals</a><nav><a href="../handbook/">Handbook</a><span>Commonplace</span></nav></header>
<header class="mast">
  <h1>Commonplace</h1>
  <div class="mast-state" aria-label="Commonplace state">
    <span><b id="localCount">0</b> kept</span>
    <span><b id="threadCount">0</b> threads</span>
    <span id="localState">local · this browser</span>
  </div>
</header>
<section class="return" id="cpReturn" hidden aria-label="Something to return to"></section>
<div class="body">
  <aside class="rail" aria-label="Commonplace index">
    <div class="rail-title"><span>Finding aid</span><small id="viewCount">0 shown</small></div>
    <label class="search-line" for="cpSearch"><span>Search</span><input id="cpSearch" type="search" placeholder="Search the book"></label>
    <div class="index-line"><label for="cpThread"><span>01</span> Thread</label><select id="cpThread"><option value="">All threads</option></select></div>
    <div class="index-line"><label for="cpSource"><span>02</span> Origin</label><select id="cpSource"><option value="">All publications</option><option value="fb">Field Brief</option><option value="ll">Loblolly &amp; Logit</option><option value="wb">The Workbook</option></select></div>
    <div class="index-line"><label for="cpImportance"><span>03</span> Weight</label><select id="cpImportance"><option value="0">Any importance</option><option value="3">3 or higher</option><option value="4">4 or higher</option><option value="5">5 only</option></select></div>
    <details class="carry">
      <summary>Carry / restore</summary>
      <p class="backup" id="backupState"></p>
      <div class="tools" aria-label="Backup and export">
        <button type="button" id="exportHtml">Readable HTML</button>
        <button type="button" id="exportMd">Markdown</button>
        <button type="button" id="exportJson">JSON backup</button>
        <button type="button" id="importBtn">Import JSON</button>
        <input type="file" id="importFile" accept="application/json,.json">
      </div>
      <button class="clear-book" type="button" id="clearCommonplace">Clear Commonplace…</button>
      <p id="importState" role="status"></p>
    </details>
  </aside>
  <main class="entries" id="commonplaceEntries" aria-live="polite"></main>
</div>
<footer class="colophon"><span>Private by default. Nothing leaves this browser unless you export it.</span><span><a href="../handbook/#commonplace">How the Commonplace works</a></span></footer>
</div>
<script src="commonplace.js"></script>
</body>
</html>
