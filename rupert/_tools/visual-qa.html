<script type="module">
import {renderAtlas} from '../assets/js/core/render.js';
document.getElementById('workspace').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow,e=d.querySelector('.atlas-register');if(e)w.scrollTo({top:w.scrollY+e.getBoundingClientRect().top-parseFloat(w.getComputedStyle(d.documentElement).getPropertyValue('--bar-h'))-16,behavior:'instant'});requestAnimationFrame(()=>requestAnimationFrame(inspect));};
document.getElementById('directory20').onclick=async()=>{
 const d=frame.contentDocument,original=await fetch('../data/places.json').then(r=>r.json()),history=await fetch('../data/editions/index.json').then(r=>r.json()),published=history.editions.filter(e=>['published','withdrawn'].includes(e.status)&&new Date(e.published_at)<=new Date()),places=[],statuses=new Map();
 for(let i=0;i<20;i++){const originalPlace=original.places.find(p=>p.id===published[i%published.length].place_id);const p={...originalPlace,id:'qa-history-'+i,short_name:(originalPlace.short_name||originalPlace.name)+' '+(i+1)};places.push(p);statuses.set(p.id,{status:i%4===0?'withdrawn':'recommended',editions:[{...published[i%published.length],label:'Historical edition'}]});}
 const model={statuses,groups:[{region:'QA fixture',places}],counts:{all:places.length},features:[],bounds:null},template=d.createElement('template');template.innerHTML=renderAtlas(model,{base:'../'});d.querySelector('.directory-list').innerHTML=template.content.querySelector('.directory-list').innerHTML;d.querySelector('.directory-note').textContent=template.content.querySelector('.directory-note').textContent;d.querySelector('.directory-list').scrollLeft=100000;requestAnimationFrame(inspect);
};
document.getElementById('menus').onclick=async()=>{
 const d=frame.contentDocument,w=frame.contentWindow,m=d.querySelector('.frame-menu'),summary=m?.querySelector('summary');if(!m)return;const delay=()=>new Promise(r=>setTimeout(r,250));
 d.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,pointerType:'mouse'}));d.activeElement?.blur();m.open=true;m.dispatchEvent(new w.PointerEvent('pointerleave',{pointerType:'mouse',relatedTarget:d.body}));await delay();const mouseLeave=!m.open;
 m.open=true;m.dispatchEvent(new w.PointerEvent('pointerleave',{pointerType:'touch',relatedTarget:d.body}));await delay();const touchRetained=m.open;
 m.open=true;summary.focus();d.dispatchEvent(new w.KeyboardEvent('keydown',{bubbles:true,key:'Tab'}));m.dispatchEvent(new w.PointerEvent('pointerleave',{pointerType:'mouse',relatedTarget:d.body}));await delay();const keyboardRetained=m.open;
 summary.dispatchEvent(new w.KeyboardEvent('keydown',{bubbles:true,key:'Escape'}));const escapeClosed=!m.open,focusReturned=d.activeElement===summary;
 window.qaMenuTests={mouseLeave,touchRetained,keyboardRetained,escapeClosed,focusReturned};inspect();
};
