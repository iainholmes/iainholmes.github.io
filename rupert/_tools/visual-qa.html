<!doctype html><html lang="en"><meta charset="utf-8"><title>The Rupert Atlas · Render Review</title><style>
body{margin:0;background:#202a35;color:#f3efe5;font:16px system-ui}form{display:flex;gap:16px;padding:14px;flex-wrap:wrap;align-items:center}label{display:flex;gap:8px}select,button{padding:8px;font:inherit}#stage{margin:0 16px;overflow:hidden}iframe{border:0;transform-origin:top left;background:#1d2a3a}#report{padding:12px;white-space:pre-wrap;font:14px monospace}
</style><form><label>Section<select id="section"><option value="index.html">This Week</option><option value="edition/2026-W40-r1-tue/index.html">Full Edition</option><option value="atlas/index.html">Atlas</option><option value="travel/index.html">Travel</option><option value="log/index.html">Field Log</option><option value="archive/index.html">Archive</option></select></label><label>Viewport<select id="size"><option value="1728,1117">Large desktop</option><option value="1366,900">Laptop</option><option value="834,1112">Tablet</option><option value="390,844">iPhone portrait</option><option value="844,390">iPhone landscape</option></select></label><button type="button" id="down">Scroll preview</button><button type="button" id="up">Top</button><button type="button" id="modules">Review modules</button><button type="button" id="inspect">Inspect rendering</button></form><div id="stage"><iframe id="frame" title="Atlas render preview"></iframe></div><pre id="report"></pre><script>
const frame=document.getElementById('frame'),stage=document.getElementById('stage'),section=document.getElementById('section'),size=document.getElementById('size');
const params=new URLSearchParams(location.search);if([...section.options].some(o=>o.value===params.get('page')))section.value=params.get('page');if([...size.options].some(o=>o.value===params.get('size')))size.value=params.get('size');
function resize(){const [w,h]=size.value.split(',').map(Number),scale=Math.min(1,(innerWidth-32)/w);frame.width=w;frame.height=h;frame.style.transform=`scale(${scale})`;stage.style.height=h*scale+'px';stage.style.width=w*scale+'px';}
function load(){resize();frame.src='../'+section.value;history.replaceState(null,'','?'+new URLSearchParams({page:section.value,size:size.value}));document.getElementById('report').textContent='Loading';}
function inspect(){const d=frame.contentDocument,w=frame.contentWindow;const style=q=>{const e=d.querySelector(q);if(!e)return null;const c=w.getComputedStyle(e);return {font:c.fontFamily,size:c.fontSize,lineHeight:c.lineHeight,box:[Math.round(e.getBoundingClientRect().width),Math.round(e.getBoundingClientRect().height)]};};document.getElementById('report').textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],overflow:d.documentElement.scrollWidth>w.innerWidth,body:style('body'),title:style('h1'),masthead:style('.wordmark'),section:style('.sec-h'),bodyCopy:style('.fun-text'),fontsLoaded:d.fonts.check('16px VELENOR')&&d.fonts.check('16px "Latin Modern Roman"'),directory:[...d.querySelectorAll('.reg-row')].map(e=>({id:e.dataset.place,links:e.querySelectorAll('a[href*="edition/"]').length})),modules:[...d.querySelectorAll('.ed-fun section')].map(e=>({height:e.offsetHeight,text:e.querySelector('p').offsetHeight,heading:e.querySelector('h2').offsetHeight})),map:style('.atlas-map')},null,2);}
frame.addEventListener('load',()=>{frame.contentDocument.fonts.ready.then(inspect)});section.onchange=load;size.onchange=resize;window.onresize=resize;document.getElementById('inspect').onclick=inspect;document.getElementById('down').onclick=()=>frame.contentWindow.scrollBy(0,frame.clientHeight*.65);document.getElementById('up').onclick=()=>frame.contentWindow.scrollTo(0,0);document.getElementById('modules').onclick=()=>frame.contentDocument.querySelector('.ed-fun,.travel-grid,.atlas-body,#log-editor,.archive-results')?.scrollIntoView();load();
</script></html>
